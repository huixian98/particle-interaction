<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 粒子蛋糕互动体验</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #ffd700;
            overflow: hidden;
            position: relative;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
            /* 确保背景是黑色 */
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease;
        }

        #fireworks-canvas.active {
            opacity: 1;
            visibility: visible;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .ui-element {
            pointer-events: auto;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
            /* 完全隐藏，不占用空间 */
        }

        #loading-progress {
            width: 300px;
            height: 4px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 20px #ffd700;
        }

        #loading-text {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        #upload-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 8px;
            color: #ffd700;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            z-index: 20;
        }

        #upload-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        #upload-btn.hidden {
            display: none;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            /* 默认显示 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        #start-screen.hidden {
            display: none;
        }

        #start-btn {
            padding: 18px 48px;
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 12px;
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #start-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        .star-icon {
            font-size: 18px;
        }

        #start-upload-btn {
            padding: 12px 32px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 8px;
            color: #ffd700;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        #start-upload-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        #camera-preview {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 200px;
            height: 150px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        #camera-preview.hidden {
            display: none;
        }

        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #camera-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #status-text {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #status-text.visible {
            opacity: 1;
        }

        #file-input {
            display: none;
        }

        .glow-text {
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ffd700;
        }
    </style>
</head>

<body>
    <div id="start-screen">
        <button id="start-btn" class="ui-element">
            <span>开启 2026</span>
            <span class="star-icon">⭐</span>
        </button>
        <button id="start-upload-btn" class="ui-element">上传照片</button>
    </div>

    <div id="canvas-container"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div id="ui-overlay">
        <div id="status-text"></div>
        <button id="upload-btn" class="ui-element hidden">上传照片</button>
        <div id="camera-preview" class="ui-element hidden">
            <video id="camera-video" autoplay playsinline></video>
            <canvas id="camera-canvas"></canvas>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*" />

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js",
        "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.esm.js"
      }
    }
  </script>

    <script type="module">
        // ==================== 配置常量 ====================
        const CONFIG = {
            PARTICLE: {
                COUNT: 20000,
                SIZE: 2,
                COLOR: 0xffd700,
                OPACITY: 1.0,
                INIT_RADIUS_MIN: 500,
                INIT_RADIUS_MAX: 800,
                SCATTER_RADIUS_MIN: 400,
                SCATTER_RADIUS_MAX: 700,
                BACKGROUND_RADIUS_MIN: 350,
                BACKGROUND_RADIUS_MAX: 800
            },
            CAMERA: {
                FOV: 55,
                NEAR: 0.1,
                FAR: 2000,
                INIT_Z: 600,
                TARGET_Z_WARP: 50,
                TARGET_Z_MAIN: 800
            },
            INTRO: {
                COUNTDOWN: ['5', '4', '3', '2', '1', '2026'],
                GATHER_DURATION: 900,
                HOLD_DURATION: 550,
                INITIAL_DELAY: 500,
                FONT_SIZE_NORMAL: 240,
                FONT_SIZE_2026: 220,
                SCALE_NORMAL: 1.5,
                SCALE_2026: 2.0
            },
            WARP_SPEED: {
                DURATION: 3000,
                SIZE_MULTIPLIER: 15,
                Z_STRETCH_FACTOR: 4,
                XY_STRETCH_FACTOR: 0.5,
                OPACITY_MIN: 0.7,
                OPACITY_MAX: 1.0
            },
            TEXT_TO_POSITIONS: {
                CANVAS_WIDTH: 2048,
                CANVAS_HEIGHT: 512,
                STEP: 2,
                ALPHA_THRESHOLD: 100,
                BASE_SCALE: 0.75
            },
            ANIMATION: {
                DT_MAX: 0.016,
                DT_MIN: 0.05,
                DISTANCE_THRESHOLD: 0.5,
                SPEED_FACTOR_BASE: 0.15,
                SPEED_FACTOR_MULT: 0.3,
                DAMPING_FAR: 0.82,
                DAMPING_MID: 0.88,
                DAMPING_NEAR: 0.92,
                CAKE_LERP: 0.05,
                HAND_ROTATION_SENSITIVITY: 0.05,
                HAND_ROTATION_SMOOTH: 0.1
            },
            GESTURE: {
                COOLDOWN: 500
            },
            FIREWORKS: {
                DURATION: 7000,
                MAX_PARTICLES: 2200,
                MAX_FIREWORKS: 10,
                STAR_COUNT: 150
            },
            CAKE: {
                LAYER_COUNT: 3,
                INSTANCES_PER_LAYER: 15000,
                DUST_COUNT: 2000,
                STAR_COUNT: 3000,
                FLOATING_TEXT: '2026祝你开心...',
                FLOATING_TEXT_SIZE: 120,
                FLOATING_TEXT_Y: 300
            }
        };

        // 模块导入
        import * as THREE from 'three';
        import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

        // 可选模块（可能加载失败）
        let Hands = null;
        let Camera = null;
        let gsap = null;
        let modulesLoadingPromise = null;

        // 异步加载可选模块
        async function loadGsapWithFallback() {
            const sources = [
                'gsap',
                'https://cdn.skypack.dev/gsap@3.12.5?min',
                'https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js'
            ];
            for (const src of sources) {
                try {
                    const module = await import(src);
                    const candidate = module.gsap || module.default || module;
                    if (candidate && typeof candidate.to === 'function') {
                        console.log('GSAP 加载成功，来源:', src);
                        return candidate;
                    }
                } catch (error) {
                    console.warn(`GSAP 源 ${src} 加载失败:`, error);
                }
            }
            return null;
        }

        modulesLoadingPromise = Promise.allSettled([
            import('@mediapipe/hands').then(m => { Hands = m.Hands; console.log('MediaPipe Hands 加载成功'); }).catch(e => console.warn('MediaPipe Hands 加载失败:', e)),
            import('@mediapipe/camera_utils').then(m => { Camera = m.Camera; console.log('MediaPipe Camera 加载成功'); }).catch(e => console.warn('MediaPipe Camera 加载失败:', e)),
            loadGsapWithFallback().then(instance => { gsap = instance; })
        ]).then(() => {
            console.log('所有可选模块加载尝试完成');
            console.log('GSAP 状态:', gsap && typeof gsap.to === 'function' ? '已加载且可用' : '未加载或不可用');
            console.log('MediaPipe 状态:', Hands && Camera ? '已加载' : '未加载');
        });

        // ==================== 全局变量 ====================
        let scene, camera, renderer, composer;
        let particleSystem, instancedMesh;
        let handTracker, cameraVideo, cameraCanvas, cameraCtx;
        let fireworksCanvas, fireworksEngine;
        let currentPhase = 'intro'; // intro, fireworks, main
        const particleCount = CONFIG.PARTICLE.COUNT;
        let positions, velocities, targets;
        let userPhotos = [];
        let sceneRotation = { x: 0, y: 0 };
        let handState = null;
        let handCenter = null;
        let lastGestureTime = 0;

        // DOM元素缓存
        const DOM = {
            statusText: null,
            uploadBtn: null,
            startBtn: null,
            startUploadBtn: null,
            fileInput: null,
            startScreen: null,
            cameraPreview: null,
            loadingScreen: null,
            canvasContainer: null
        };

        // 初始化DOM缓存
        function initDOMCache() {
            DOM.statusText = document.getElementById('status-text');
            DOM.uploadBtn = document.getElementById('upload-btn');
            DOM.startBtn = document.getElementById('start-btn');
            DOM.startUploadBtn = document.getElementById('start-upload-btn');
            DOM.fileInput = document.getElementById('file-input');
            DOM.startScreen = document.getElementById('start-screen');
            DOM.cameraPreview = document.getElementById('camera-preview');
            DOM.loadingScreen = document.getElementById('loading-screen');
            DOM.canvasContainer = document.getElementById('canvas-container');
        }

        // ==================== 工具函数 ====================
        function showStatus(text, duration = 2000) {
            if (!DOM.statusText) return;
            DOM.statusText.textContent = text;
            DOM.statusText.classList.add('visible');
            setTimeout(() => {
                if (DOM.statusText) {
                    DOM.statusText.classList.remove('visible');
                }
            }, duration);
        }

        function textToPositions(text, fontSize = 200, scaleMultiplier = 1.0) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const cfg = CONFIG.TEXT_TO_POSITIONS;
            canvas.width = cfg.CANVAS_WIDTH;
            canvas.height = cfg.CANVAS_HEIGHT;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `bold ${fontSize}px Arial, sans-serif`;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const positions = [];
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const halfWidth = canvas.width / 2;
            const halfHeight = canvas.height / 2;
            const scale = cfg.BASE_SCALE * scaleMultiplier;

            for (let y = 0; y < canvas.height; y += cfg.STEP) {
                const yOffset = y * canvas.width;
                for (let x = 0; x < canvas.width; x += cfg.STEP) {
                    const alpha = data[(yOffset + x) * 4 + 3];
                    if (alpha > cfg.ALPHA_THRESHOLD) {
                        positions.push((x - halfWidth) * scale);
                        positions.push((halfHeight - y) * scale);
                        positions.push(0);
                    }
                }
            }

            console.log(`文本 "${text}" 提取了 ${positions.length / 3} 个粒子位置，缩放倍数: ${scaleMultiplier}`);
            return new Float32Array(positions);
        }

        function getVisibleHeightAtDepth(depth = 0) {
            if (!camera) {
                const fallbackFov = THREE.MathUtils.degToRad(55);
                const fallbackDistance = Math.abs(600 - depth);
                return 2 * Math.tan(fallbackFov / 2) * Math.max(fallbackDistance, 0.1);
            }
            const distance = Math.abs(camera.position.z - depth);
            const vFov = THREE.MathUtils.degToRad(camera.fov);
            return 2 * Math.tan(vFov / 2) * Math.max(distance, 0.1);
        }

        function getVisibleWidthAtDepth(depth = 0) {
            const height = getVisibleHeightAtDepth(depth);
            if (camera) {
                return height * camera.aspect;
            }
            const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
            return height * aspect;
        }

        // ==================== 初始化场景 ====================
        function initScene() {
            try {
                if (!DOM.canvasContainer) {
                    throw new Error('找不到 canvas-container 元素');
                }

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000000);

                const cfg = CONFIG.CAMERA;
                camera = new THREE.PerspectiveCamera(
                    cfg.FOV,
                    window.innerWidth / window.innerHeight,
                    cfg.NEAR,
                    cfg.FAR
                );
                camera.position.set(0, 0, cfg.INIT_Z);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                DOM.canvasContainer.appendChild(renderer.domElement);

                console.log('Three.js 场景初始化完成');
            } catch (error) {
                console.error('场景初始化错误:', error);
                throw error;
            }

            // Post-processing
            try {
                composer = new EffectComposer(renderer);
                composer.addPass(new RenderPass(scene, camera));
                composer.addPass(new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    1.5, 0.4, 0.85
                ));
                console.log('后处理效果初始化完成');
            } catch (error) {
                console.warn('后处理效果初始化失败，将使用基础渲染:', error);
                composer = null;
            }

            initParticles();
            initPostProcessing();
            window.addEventListener('resize', onWindowResize);
        }

        function initParticles() {
            console.log('初始化粒子系统，粒子数量:', particleCount);
            const cfg = CONFIG.PARTICLE;
            positions = new Float32Array(particleCount * 3);
            velocities = new Float32Array(particleCount * 3);
            targets = new Float32Array(particleCount * 3);

            const radiusRange = cfg.INIT_RADIUS_MAX - cfg.INIT_RADIUS_MIN;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                const radius = cfg.INIT_RADIUS_MIN + Math.random() * radiusRange;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const sinPhi = Math.sin(phi);

                positions[idx] = radius * sinPhi * Math.cos(theta);
                positions[idx + 1] = radius * Math.cos(phi);
                positions[idx + 2] = radius * sinPhi * Math.sin(theta);

                targets[idx] = positions[idx];
                targets[idx + 1] = positions[idx + 1];
                targets[idx + 2] = positions[idx + 2];
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: cfg.SIZE,
                color: cfg.COLOR,
                transparent: true,
                opacity: cfg.OPACITY,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            console.log('粒子系统已添加到场景，粒子数:', particleSystem.geometry.attributes.position.count / 3);
        }

        function initPostProcessing() {
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            // 添加点光源
            const pointLight = new THREE.PointLight(0xffd700, 2, 1000);
            pointLight.position.set(0, 0, 500);
            scene.add(pointLight);
        }

        // ==================== 倒计时序列 ====================
        async function startIntroSequence() {
            console.log('开始倒计时序列');
            currentPhase = 'intro';

            if (!particleSystem) {
                console.error('粒子系统未创建！');
                return;
            }

            if (DOM.loadingScreen) {
                DOM.loadingScreen.style.transition = 'opacity 1s ease-out';
                DOM.loadingScreen.style.opacity = '0.3';
                setTimeout(() => {
                    if (DOM.loadingScreen) {
                        DOM.loadingScreen.classList.add('hidden');
                        console.log('加载屏幕已隐藏');
                    }
                }, 1500);
            }

            console.log('显示初始粒子云...');
            scatterParticles();
            await new Promise(resolve => setTimeout(resolve, CONFIG.INTRO.INITIAL_DELAY));

            const cfg = CONFIG.INTRO;
            const countdown = cfg.COUNTDOWN;

            for (let i = 0; i < countdown.length; i++) {
                const text = countdown[i];
                console.log(`显示倒计时: ${text}`);

                const is2026 = text === '2026';
                const fontSize = is2026 ? cfg.FONT_SIZE_2026 : cfg.FONT_SIZE_NORMAL;
                const scale = is2026 ? cfg.SCALE_2026 : cfg.SCALE_NORMAL;
                const textPositions = textToPositions(text, fontSize, scale);
                console.log(`文本 "${text}" 生成 ${textPositions.length / 3} 个粒子位置`);

                retargetParticles(textPositions);
                await new Promise(resolve => setTimeout(resolve, cfg.GATHER_DURATION));
                console.log(`步骤2: 保持数字 "${text}"`);
                await new Promise(resolve => setTimeout(resolve, cfg.HOLD_DURATION));

                if (i < countdown.length - 1) {
                    console.log(`步骤3: 准备下一个数字`);
                    scatterParticles();
                }
            }

            await warpSpeedEffect();
            await fireworksTransition();
        }

        function scatterParticles() {
            console.log('粒子散开...');
            const cfg = CONFIG.PARTICLE;
            const radiusRange = cfg.SCATTER_RADIUS_MAX - cfg.SCATTER_RADIUS_MIN;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                const radius = cfg.SCATTER_RADIUS_MIN + Math.random() * radiusRange;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const sinPhi = Math.sin(phi);

                targets[idx] = radius * sinPhi * Math.cos(theta);
                targets[idx + 1] = radius * Math.cos(phi);
                targets[idx + 2] = radius * sinPhi * Math.sin(theta);
            }
        }

        function retargetParticles(newTargets) {
            const targetCount = newTargets.length / 3;
            console.log(`重新定位粒子: 目标位置数=${targetCount}, 粒子数=${particleCount}`);

            if (targetCount === 0) {
                console.warn('目标位置为空！');
                return;
            }

            const textParticleCount = Math.min(targetCount, particleCount);
            const backgroundParticleCount = particleCount - textParticleCount;
            const cfg = CONFIG.PARTICLE;
            const bgRadiusRange = cfg.BACKGROUND_RADIUS_MAX - cfg.BACKGROUND_RADIUS_MIN;

            if (targetCount >= particleCount) {
                const step = targetCount / particleCount;
                for (let i = 0; i < particleCount; i++) {
                    const srcIdx = Math.floor(i * step) * 3;
                    const dst = i * 3;
                    targets[dst] = newTargets[srcIdx] || 0;
                    targets[dst + 1] = newTargets[srcIdx + 1] || 0;
                    targets[dst + 2] = newTargets[srcIdx + 2] || 0;
                }
            } else {
                for (let i = 0; i < targetCount; i++) {
                    const srcIdx = i * 3;
                    const dst = i * 3;
                    targets[dst] = newTargets[srcIdx] || 0;
                    targets[dst + 1] = newTargets[srcIdx + 1] || 0;
                    targets[dst + 2] = newTargets[srcIdx + 2] || 0;
                }

                for (let i = targetCount; i < particleCount; i++) {
                    const dst = i * 3;
                    const radius = cfg.BACKGROUND_RADIUS_MIN + Math.random() * bgRadiusRange;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(Math.random() * 2 - 1);
                    const sinPhi = Math.sin(phi);

                    targets[dst] = radius * sinPhi * Math.cos(theta);
                    targets[dst + 1] = radius * Math.cos(phi);
                    targets[dst + 2] = radius * sinPhi * Math.sin(theta);
                }
            }

            console.log(`粒子重新定位完成: ${textParticleCount} 个形成数字, ${backgroundParticleCount} 个作为背景`);
        }

        async function warpSpeedEffect() {
            return new Promise(resolve => {
                try {
                    console.log('开始 Warp Speed 效果（星际穿越）');
                    const cfg = CONFIG.WARP_SPEED;
                    const camCfg = CONFIG.CAMERA;
                    const startZ = camera.position.z;
                    const targetZ = camCfg.TARGET_Z_WARP;
                    const startParticleSize = particleSystem ? particleSystem.material.size : CONFIG.PARTICLE.SIZE;
                    const originalTargets = new Float32Array(targets);

                    const updateParticles = (stretch) => {
                        if (!particleSystem) return;
                        const sizeMultiplier = 1 + stretch * stretch * cfg.SIZE_MULTIPLIER;
                        particleSystem.material.size = startParticleSize * sizeMultiplier;

                        const positionArray = particleSystem.geometry.attributes.position.array;
                        const zStretchFactor = 1 + stretch * stretch * cfg.Z_STRETCH_FACTOR;
                        const xyStretchFactor = 1 + stretch * cfg.XY_STRETCH_FACTOR;

                        for (let i = 0; i < particleCount; i++) {
                            const idx = i * 3;
                            const origX = originalTargets[idx] || 0;
                            const origY = originalTargets[idx + 1] || 0;
                            const origZ = originalTargets[idx + 2] || 0;

                            positionArray[idx] = origX * xyStretchFactor;
                            positionArray[idx + 1] = origY * xyStretchFactor;
                            positionArray[idx + 2] = origZ * zStretchFactor;
                        }
                        particleSystem.geometry.attributes.position.needsUpdate = true;
                        particleSystem.material.opacity = Math.min(1, cfg.OPACITY_MIN + stretch * (cfg.OPACITY_MAX - cfg.OPACITY_MIN));
                    };

                    const complete = () => {
                        console.log('Warp Speed 效果完成');
                        if (particleSystem) particleSystem.visible = false;
                        camera.position.z = camCfg.INIT_Z;
                        resolve();
                    };

                    if (!gsap || typeof gsap.to !== 'function') {
                        console.warn('GSAP 未加载，使用简单动画');
                        const startTime = Date.now();
                        const animate = () => {
                            const elapsed = Date.now() - startTime;
                            const progress = Math.min(elapsed / cfg.DURATION, 1);
                            const easeProgress = 1 - Math.pow(1 - progress, 4);

                            camera.position.z = startZ + (targetZ - startZ) * easeProgress;
                            updateParticles(easeProgress);

                            if (progress < 1) {
                                requestAnimationFrame(animate);
                            } else {
                                complete();
                            }
                        };
                        animate();
                    } else {
                        gsap.to(camera.position, {
                            z: targetZ,
                            duration: cfg.DURATION / 1000,
                            ease: 'power3.in',
                            onUpdate: () => {
                                const progress = Math.max(0, Math.min(1, (camera.position.z - startZ) / (targetZ - startZ)));
                                updateParticles(progress);
                            },
                            onComplete: complete
                        });
                    }
                } catch (error) {
                    console.error('Warp Speed 效果错误:', error);
                    resolve();
                }
            });
        }

        // ==================== Canvas 烟花系统 ====================
        function clampColor(value) {
            return Math.max(0, Math.min(255, value));
        }

        function hexToRgbColor(hex) {
            if (!hex) return { r: 255, g: 255, b: 255 };
            const normalized = hex.replace('#', '');
            const expanded = normalized.length === 3 ? normalized.replace(/(.)/g, '$1$1') : normalized;
            const bigint = parseInt(expanded, 16);
            return {
                r: clampColor((bigint >> 16) & 255),
                g: clampColor((bigint >> 8) & 255),
                b: clampColor(bigint & 255)
            };
        }

        function jitterRgb(rgb, amount = 20) {
            return {
                r: clampColor(rgb.r + (Math.random() - 0.5) * amount * 2),
                g: clampColor(rgb.g + (Math.random() - 0.5) * amount * 2),
                b: clampColor(rgb.b + (Math.random() - 0.5) * amount * 2)
            };
        }

        function rgbToString(rgb, alpha = 1) {
            return `rgba(${Math.round(rgb.r)}, ${Math.round(rgb.g)}, ${Math.round(rgb.b)}, ${Math.max(0, Math.min(1, alpha))})`;
        }

        class FireworkParticle {
            constructor(engine) {
                this.engine = engine;
                this.active = false;
            }

            init(config) {
                this.x = config.x;
                this.y = config.y;
                this.prevX = this.x;
                this.prevY = this.y;
                this.vx = config.vx;
                this.vy = config.vy;
                this.baseSize = config.size || 3;
                this.size = this.baseSize;
                this.alpha = config.alpha ?? 1;
                this.life = 0;
                this.lifespan = config.lifespan || 1.5;
                this.gravity = (config.gravity ?? 0.12) * 3600;
                this.resistance = config.resistance ?? 0.98;
                this.decay = config.decay ?? 0.02;
                this.shrink = config.shrink ?? 0.96;
                this.color = config.color || { r: 255, g: 255, b: 255 };
                this.trailTimer = 0;
                this.allowReburst = config.allowReburst ?? false;
                this.reburstTriggered = false;
                this.flicker = Math.random() < 0.5; // 增加闪烁粒子比例
                this.flickerIntensity = 0.3 + Math.random() * 0.4; // 闪烁强度
                this.sparkle = Math.random() < 0.3; // 星闪效果
                this.sparklePhase = Math.random() * Math.PI * 2; // 星闪相位
                this.rotation = Math.random() * Math.PI * 2; // 粒子旋转
                this.rotationSpeed = (Math.random() - 0.5) * 0.1; // 旋转速度
                this.active = true;
                return this;
            }

            update(dt) {
                const frameRatio = dt / (1 / 60);
                const resistance = Math.pow(this.resistance, frameRatio);
                this.prevX = this.x;
                this.prevY = this.y;

                // 简单的物理运动：重力和空气阻力
                // 水平速度：受空气阻力影响，逐渐减慢
                this.vx *= resistance;

                // 垂直速度：受重力和空气阻力影响
                this.vy = this.vy * resistance + this.gravity * dt;

                // 更新位置
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                this.life += dt;
                this.rotation += this.rotationSpeed * dt;

                // 尺寸变化：粒子逐渐减小
                const shrink = Math.pow(this.shrink, frameRatio);
                this.size = Math.max(0, this.size * shrink);

                // Alpha衰减：随时间淡出消失
                const lifeProgress = this.life / this.lifespan;
                const baseAlpha = Math.max(0, 1 - lifeProgress * lifeProgress); // 二次衰减，更平滑
                this.alpha = baseAlpha * (this.alpha ?? 1);

                // 闪烁效果增强
                if (this.flicker) {
                    const flickerValue = Math.sin(this.life * 15 + Math.random() * Math.PI) * this.flickerIntensity;
                    this.alpha += flickerValue * 0.15;
                }

                // 星闪效果
                if (this.sparkle) {
                    const sparkleValue = (Math.sin(this.life * 20 + this.sparklePhase) + 1) * 0.5;
                    this.alpha += sparkleValue * 0.2;
                }

                this.alpha = Math.min(1, Math.max(0, this.alpha));

                if (
                    this.allowReburst &&
                    !this.reburstTriggered &&
                    this.life > this.lifespan * 0.3 &&
                    this.life < this.lifespan * 0.6 &&
                    Math.random() < 0.025
                ) {
                    this.reburstTriggered = true;
                    this.engine.createSubExplosion(this.x, this.y, this.color);
                }

                // 轨迹拖尾：快速粒子留下光痕
                // 简化拖尾效果
                this.trailTimer += dt;
                if (this.trailTimer >= 0.02) {
                    this.engine.trails.push({
                        x: this.x,
                        y: this.y,
                        alpha: this.alpha * 0.5,
                        size: Math.max(0.4, this.size * 0.5),
                        decay: 2.5,
                        color: rgbToString(this.color, 0.4)
                    });
                    this.trailTimer = 0;
                }

                if (
                    this.alpha <= 0 ||
                    this.size <= 0.1 ||
                    this.y > this.engine.height + 150 ||
                    this.x < -150 ||
                    this.x > this.engine.width + 150
                ) {
                    this.release();
                    return false;
                }

                return true;
            }

            draw(ctx) {
                // 去掉光晕，只绘制简单的圆点
                const radius = Math.max(0.8, this.size);

                // 简单的实心圆点
                ctx.fillStyle = rgbToString(this.color, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            release() {
                this.active = false;
                this.engine.particlePool.push(this);
            }
        }
        class FireworksEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.rockets = [];
                this.particles = [];
                this.trails = [];
                this.smokes = [];
                this.coreFlashes = [];
                this.screenFlash = 0;
                this.particlePool = [];
                this.maxParticles = CONFIG.FIREWORKS.MAX_PARTICLES;
                this.maxFireworks = CONFIG.FIREWORKS.MAX_FIREWORKS;
                this.running = false;
                this.activeShow = false;
                this.launchTimer = 0;
                this.nextLaunchDelay = this.randomLaunchDelay();
                this.duration = 6000;
                this.elapsed = 0;
                this.resolveShow = null;
                this.lastTime = 0;
                this.stars = [];
                this.themeBase = [
                    { colors: ['#ffffff', '#ffd700', '#ffa500', '#ff8c00'], smoke: 'rgba(255, 210, 130, 0.2)' },
                    { colors: ['#ffffff', '#ff0000', '#ff4500', '#b22222'], smoke: 'rgba(255, 120, 120, 0.2)' },
                    { colors: ['#ffffff', '#1e90ff', '#00bfff', '#4169e1'], smoke: 'rgba(140, 190, 255, 0.18)' },
                    { colors: ['#ffffff', '#32cd32', '#00ff00', '#228b22'], smoke: 'rgba(180, 255, 200, 0.16)' },
                    { colors: ['#ffffff', '#9370db', '#ba55d3', '#8a2be2'], smoke: 'rgba(210, 180, 255, 0.2)' }
                ];
                this.themePool = [];
                this.loop = this.loop.bind(this);
                this.resize = this.resize.bind(this);
                this.resize();
                window.addEventListener('resize', this.resize);
            }

            randomLaunchDelay() {
                return 200 + Math.random() * 600;
            }

            resize() {
                if (!this.canvas) return;
                this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width * this.pixelRatio;
                this.canvas.height = this.height * this.pixelRatio;
                this.canvas.style.width = `${this.width}px`;
                this.canvas.style.height = `${this.height}px`;
                this.ctx.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0);
                this.generateStars();
            }

            generateStars() {
                const count = CONFIG.FIREWORKS.STAR_COUNT;
                this.stars = Array.from({ length: count }, () => ({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    size: Math.random() * 2 + 0.5,
                    alpha: 0.2 + Math.random() * 0.4
                }));
            }

            start() {
                if (this.running) return;
                this.running = true;
                this.lastTime = performance.now();
                requestAnimationFrame(this.loop);
            }

            stop(clearCanvas = true) {
                this.running = false;
                this.activeShow = false;
                this.resolveShow?.();
                this.resolveShow = null;
                this.rockets = [];
                this.particles = [];
                this.trails = [];
                this.smokes = [];
                this.coreFlashes = [];
                this.screenFlash = 0;
                if (clearCanvas && this.ctx) {
                    this.ctx.clearRect(0, 0, this.width, this.height);
                }
            }

            playShow(duration = 6500) {
                this.duration = duration;
                this.elapsed = 0;
                this.launchTimer = 0;
                this.nextLaunchDelay = this.randomLaunchDelay();
                this.activeShow = true;
                this.launchBurst(5);
                if (!this.running) {
                    this.start();
                }
                return new Promise(resolve => {
                    this.resolveShow = resolve;
                });
            }

            launchBurst(count) {
                const lanes = Math.min(count, this.maxFireworks);
                for (let i = 0; i < lanes; i++) {
                    const delay = Math.random() * 300 + i * 80;
                    setTimeout(() => {
                        if (!this.running && !this.activeShow) return;
                        const laneWidth = this.width / (lanes + 1);
                        const preferredX = laneWidth * (i + 1) + (Math.random() - 0.5) * laneWidth * 0.3;
                        this.spawnRocket(preferredX);
                    }, delay);
                }
            }

            loop(timestamp) {
                if (!this.running) return;
                const dt = Math.min(0.05, Math.max(0.016, (timestamp - this.lastTime) / 1000 || 0.016));
                this.lastTime = timestamp;
                this.update(dt);
                this.render();
                requestAnimationFrame(this.loop);
            }

            update(dt) {
                if (this.activeShow) {
                    this.launchTimer += dt * 1000;
                    this.elapsed += dt * 1000;
                    if (this.launchTimer >= this.nextLaunchDelay) {
                        this.launchTimer = 0;
                        this.nextLaunchDelay = this.randomLaunchDelay();
                        this.spawnRocket();
                    }
                    if (this.elapsed >= this.duration) {
                        this.activeShow = false;
                    }
                }

                this.updateRockets(dt);
                this.updateParticles(dt);
                this.updateTrails(dt);
                this.updateSmoke(dt);
                this.updateCoreFlashes(dt);

                const inactive = !this.activeShow &&
                    this.rockets.length === 0 &&
                    this.particles.length === 0 &&
                    this.trails.length === 0 &&
                    this.smokes.length === 0;

                if (inactive && this.resolveShow) {
                    const resolve = this.resolveShow;
                    this.resolveShow = null;
                    resolve();
                }
            }

            spawnRocket(preferredX) {
                if (this.rockets.length >= this.maxFireworks) return;
                const launchX = typeof preferredX === 'number'
                    ? preferredX
                    : this.width * (0.25 + Math.random() * 0.5);
                const startY = this.height + 30;
                const targetY = this.height * 0.3 + Math.random() * this.height * 0.1;
                const travel = startY - targetY;
                const vy = -Math.sqrt(2 * 520 * travel);
                const theme = this.randomColorTheme();
                this.rockets.push({
                    x: launchX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 80,
                    vy,
                    life: 0,
                    targetY,
                    theme,
                    wobbleSeed: Math.random() * Math.PI * 2,
                    exploded: false,
                    trailTick: 0
                });
            }

            randomColorTheme() {
                // 随机颜色主题：红、橙、黄、绿、蓝、紫
                const themes = [
                    { colors: ['#ffffff', '#ff0000', '#ff4444', '#cc0000'], smoke: 'rgba(255, 120, 120, 0.2)' }, // 红色
                    { colors: ['#ffffff', '#ff8800', '#ffaa44', '#ff6600'], smoke: 'rgba(255, 180, 120, 0.2)' }, // 橙色
                    { colors: ['#ffffff', '#ffd700', '#ffed4e', '#ffaa00'], smoke: 'rgba(255, 210, 130, 0.2)' }, // 黄色
                    { colors: ['#ffffff', '#00ff00', '#44ff44', '#00cc00'], smoke: 'rgba(180, 255, 200, 0.16)' }, // 绿色
                    { colors: ['#ffffff', '#0088ff', '#44aaff', '#0066cc'], smoke: 'rgba(140, 190, 255, 0.18)' }, // 蓝色
                    { colors: ['#ffffff', '#aa00ff', '#cc44ff', '#8800cc'], smoke: 'rgba(210, 180, 255, 0.2)' }  // 紫色
                ];
                return themes[Math.floor(Math.random() * themes.length)];
            }
            updateRockets(dt) {
                for (let i = this.rockets.length - 1; i >= 0; i--) {
                    const rocket = this.rockets[i];
                    rocket.life += dt;
                    rocket.vy += 120 * dt;
                    rocket.vx += Math.sin(rocket.life * 6 + rocket.wobbleSeed) * 10 * dt;
                    rocket.x += rocket.vx * dt;
                    rocket.y += rocket.vy * dt;
                    rocket.trailTick += dt;

                    if (rocket.trailTick >= 0.015) {
                        this.trails.push({
                            x: rocket.x,
                            y: rocket.y,
                            alpha: 1,
                            size: 2.5,
                            decay: 3,
                            color: rgbToString(hexToRgbColor(rocket.theme.colors[1]), 0.9)
                        });
                        rocket.trailTick = 0;
                    }

                    if ((rocket.y <= rocket.targetY || rocket.vy >= 0) && !rocket.exploded) {
                        this.createExplosion(rocket.x, rocket.y, rocket.theme);
                        this.rockets.splice(i, 1);
                    } else if (rocket.y < -50) {
                        this.rockets.splice(i, 1);
                    }
                }
            }

            getParticle(config) {
                const pooled = this.particlePool.pop();
                const particle = (pooled || new FireworkParticle(this)).init(config);
                if (this.particles.length < this.maxParticles) {
                    this.particles.push(particle);
                }
            }

            spawnParticleLayer(x, y, options) {
                const {
                    count,
                    speed,
                    size,
                    gravity,
                    resistance,
                    lifespan,
                    colors,
                    allowReburst,
                    upwardBias = 0.5 // 默认50%向上，50%向下
                } = options;

                for (let i = 0; i < count; i++) {
                    // 优化粒子分布，使用更自然的随机分布
                    const bias = Math.pow(Math.random(), 0.3);
                    const speedPerFrame = speed[0] + (speed[1] - speed[0]) * bias;
                    const velocity = speedPerFrame * 60;

                    // 360度均匀散开，形成圆形爆炸
                    const theta = Math.random() * Math.PI * 2;

                    // 添加轻微的角度变化，让爆炸更自然
                    const angleVariation = (Math.random() - 0.5) * 0.05;
                    const vx = Math.cos(theta + angleVariation) * velocity;
                    const vy = Math.sin(theta + angleVariation) * velocity;

                    const sizeValue = size[0] + Math.random() * (size[1] - size[0]);
                    const resistanceValue = resistance[0] + Math.random() * (resistance[1] - resistance[0]);
                    const lifespanValue = lifespan[0] + Math.random() * (lifespan[1] - lifespan[0]);

                    // 优化颜色选择，增加颜色变化
                    const baseColor = colors[Math.floor(Math.random() * colors.length)];
                    const color = jitterRgb(baseColor, 25);

                    this.getParticle({
                        x,
                        y,
                        vx,
                        vy,
                        size: sizeValue,
                        lifespan: lifespanValue,
                        gravity,
                        resistance: resistanceValue,
                        color,
                        allowReburst: allowReburst && Math.random() < 0.45,
                        shrink: 0.94 + Math.random() * 0.03,
                        decay: 0.008 + Math.random() * 0.025,
                        alpha: 0.9 + Math.random() * 0.1
                    });
                }
            }

            createExplosion(x, y, theme) {
                const palette = theme.colors.map(hexToRgbColor);

                // 移除中心闪光效果，爆炸点立即消失，不留晕影
                // this.coreFlashes.push(...) - 已移除
                // this.screenFlash - 已移除

                // 生成大量彩色粒子，向四周随机方向扩散
                // 第一层：快速核心粒子
                this.spawnParticleLayer(x, y, {
                    count: 120, // 增加数量：80 -> 120
                    speed: [5, 14], // 增大范围：4-10 -> 5-14
                    size: [2.5, 5],
                    gravity: 0.15, // 重力影响
                    resistance: [0.96, 0.99], // 空气阻力
                    lifespan: [1.5, 2.5],
                    colors: palette,
                    allowReburst: false,
                    upwardBias: 0.0 // 360度均匀散开 
                });

                // 第二层：主要爆炸粒子
                this.spawnParticleLayer(x, y, {
                    count: 180, // 增加数量：120 -> 180
                    speed: [4, 12], // 增大范围：3-8 -> 4-12
                    size: [2, 4],
                    gravity: 0.16,
                    resistance: [0.97, 0.99],
                    lifespan: [1.8, 2.8],
                    colors: palette,
                    allowReburst: false,
                    upwardBias: 0.0
                });

                // 第三层：细节粒子
                this.spawnParticleLayer(x, y, {
                    count: 150, // 增加数量：100 -> 150
                    speed: [3, 10], // 增大范围：2-6 -> 3-10
                    size: [1.5, 3],
                    gravity: 0.17,
                    resistance: [0.98, 0.995],
                    lifespan: [2.0, 3.0],
                    colors: palette,
                    allowReburst: false,
                    upwardBias: 0.0
                });

                // 烟雾效果
                for (let i = 0; i < 30; i++) {
                    this.smokes.push({
                        x: x + (Math.random() - 0.5) * 20,
                        y: y + (Math.random() - 0.5) * 20,
                        vx: (Math.random() - 0.5) * 15,
                        vy: -10 - Math.random() * 15,
                        alpha: Math.random() * 0.1,
                        decay: 0.12 + Math.random() * 0.08,
                        size: 15 + Math.random() * 25,
                        color: theme.smoke
                    });
                }
            }

            createSubExplosion(x, y, baseColor) {
                const palette = [
                    baseColor,
                    hexToRgbColor('#ffffff'),
                    jitterRgb(baseColor, 30)
                ];
                this.spawnParticleLayer(x, y, {
                    count: 22 + Math.floor(Math.random() * 18),
                    speed: [2, 4], // 适中的速度，大致在范围内
                    size: [1.2, 3],
                    gravity: 0.17, // 适中的重力，形成自然下坠
                    resistance: [0.98, 0.995], // 适中的阻力
                    lifespan: [1.5, 2.5], // 增加生命周期
                    colors: palette,
                    allowReburst: false,
                    upwardBias: 0.4
                });

                // 移除小闪光，爆炸点立即消失
                // this.coreFlashes.push(...) - 已移除
            }
            updateParticles(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const particle = this.particles[i];
                    if (!particle.update(dt)) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            updateTrails(dt) {
                for (let i = this.trails.length - 1; i >= 0; i--) {
                    const trail = this.trails[i];
                    trail.alpha -= dt * trail.decay;
                    trail.size = Math.max(0, trail.size - dt * 2.5);
                    if (trail.alpha <= 0 || trail.size <= 0) {
                        this.trails.splice(i, 1);
                    }
                }
            }

            updateSmoke(dt) {
                for (let i = this.smokes.length - 1; i >= 0; i--) {
                    const smoke = this.smokes[i];
                    smoke.vx *= 0.98;
                    smoke.vy = smoke.vy * 0.98 - 5 * dt;
                    smoke.x += smoke.vx * dt;
                    smoke.y += smoke.vy * dt;
                    smoke.size += dt * 10;
                    smoke.alpha -= smoke.decay * dt;
                    if (smoke.alpha <= 0) {
                        this.smokes.splice(i, 1);
                    }
                }
            }

            updateCoreFlashes(dt) {
                for (let i = this.coreFlashes.length - 1; i >= 0; i--) {
                    const flash = this.coreFlashes[i];
                    flash.life += dt;

                    // 快速扩散，快速消散
                    const maxRadius = flash.maxRadius || 60;
                    const expansionSpeed = flash.life < 0.08 ? 150 : 80; // 初始快速扩散
                    flash.radius = Math.min(maxRadius, flash.radius + dt * expansionSpeed);

                    // 快速衰减，模拟真实快速消散
                    const fadeStart = 2; // 更早开始衰减
                    if (flash.life < fadeStart) {
                        flash.alpha = Math.min(flash.alpha, 0.8);
                    } else {
                        // 使用更激进的衰减曲线，快速消散
                        const fadeDuration = 0.25; // 缩短衰减时间
                        const fadeProgress = Math.min(1, (flash.life - fadeStart) / fadeDuration);
                        // 使用三次方衰减，让消散更快
                        flash.alpha = flash.alpha * (1 - fadeProgress * fadeProgress * fadeProgress);
                    }

                    if (flash.alpha <= 0.01 || flash.radius >= maxRadius) {
                        this.coreFlashes.splice(i, 1);
                    }
                }
                this.screenFlash *= 0.75; // 加快屏幕闪光消散
            }

            render() {
                const ctx = this.ctx;
                if (!ctx) return;

                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; // 稍微减少背景暗化，让烟花更亮
                ctx.fillRect(0, 0, this.width, this.height);
                this.drawStars(ctx);

                // 使用lighter混合模式让烟花更亮更自然
                ctx.globalCompositeOperation = 'lighter';
                this.drawTrails(ctx);
                this.drawRockets(ctx);
                this.drawParticles(ctx);
                this.drawCoreFlashes(ctx);

                ctx.globalCompositeOperation = 'source-over';
                this.drawSmoke(ctx);
            }

            drawStars(ctx) {
                ctx.save();
                ctx.fillStyle = '#ffffff';
                this.stars.forEach(star => {
                    ctx.globalAlpha = star.alpha;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            drawRockets(ctx) {
                this.rockets.forEach(rocket => {
                    const gradient = ctx.createRadialGradient(rocket.x, rocket.y, 0, rocket.x, rocket.y, 10);
                    gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
                    gradient.addColorStop(0.5, rocket.theme.colors[0]);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(rocket.x, rocket.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            drawParticles(ctx) {
                this.particles.forEach(particle => particle.draw(ctx));
            }

            drawTrails(ctx) {
                this.trails.forEach(trail => {
                    // 优化拖尾绘制，增加渐变效果
                    const gradient = ctx.createRadialGradient(
                        trail.x, trail.y, 0,
                        trail.x, trail.y, trail.size
                    );
                    gradient.addColorStop(0, trail.color);
                    gradient.addColorStop(0.5, this.applyAlpha(trail.color, trail.alpha * 0.6));
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');

                    ctx.fillStyle = gradient;
                    ctx.globalAlpha = trail.alpha;
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, trail.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }

            drawSmoke(ctx) {
                this.smokes.forEach(smoke => {
                    const gradient = ctx.createRadialGradient(smoke.x, smoke.y, 0, smoke.x, smoke.y, smoke.size);
                    gradient.addColorStop(0, this.applyAlpha(smoke.color, smoke.alpha));
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(smoke.x, smoke.y, smoke.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            drawCoreFlashes(ctx) {
                // 不绘制核心闪光，爆炸点立即消失，不留晕影
                // 函数保留但为空，避免调用错误
            }

            applyAlpha(color, alpha) {
                if (typeof color === 'string') {
                    const match = color.match(/rgba?\(([^)]+)\)/);
                    if (match) {
                        const parts = match[1].split(',').map(v => v.trim());
                        const [r, g, b] = parts;
                        return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, alpha))})`;
                    }
                    return color;
                }
                const rgb = hexToRgbColor(color);
                return rgbToString(rgb, alpha);
            }
        }

        // ==================== 主场景：数字蛋糕 ====================
        async function transitionToMainScene() {
            console.log('开始过渡到主场景');
            currentPhase = 'main';
            const camCfg = CONFIG.CAMERA;
            const targetCameraZ = camCfg.TARGET_Z_MAIN;
            const duration = 2500;

            if (gsap && typeof gsap.to === 'function') {
                gsap.to(camera.position, {
                    x: 0, y: 0, z: targetCameraZ,
                    duration: duration / 1000,
                    ease: 'power2.out'
                });
                await new Promise(resolve => setTimeout(resolve, duration));
            } else {
                const startPos = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
                const targetPos = { x: 0, y: 0, z: targetCameraZ };
                const startTime = Date.now();

                await new Promise(resolve => {
                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const easeProgress = 1 - Math.pow(1 - progress, 2);

                        camera.position.x = startPos.x + (targetPos.x - startPos.x) * easeProgress;
                        camera.position.y = startPos.y + (targetPos.y - startPos.y) * easeProgress;
                        camera.position.z = startPos.z + (targetPos.z - startPos.z) * easeProgress;

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            resolve();
                        }
                    };
                    animate();
                });
            }

            scene.remove(particleSystem);
            createCakeStructure();
            createGoldDust();
            createStarField();
            createFloatingText();

            await new Promise(resolve => setTimeout(resolve, 300));

            if (DOM.uploadBtn) DOM.uploadBtn.classList.remove('hidden');
            if (DOM.cameraPreview) DOM.cameraPreview.classList.remove('hidden');

            showStatus('欢迎来到2026！', 3000);
        }

        function createCakeStructure() {
            const cfg = CONFIG.CAKE;
            const layerCount = cfg.LAYER_COUNT;
            const instancesPerLayer = cfg.INSTANCES_PER_LAYER;
            const geometries = [
                new THREE.SphereGeometry(0.5, 8, 8),
                new THREE.CylinderGeometry(0.3, 0.3, 1, 8),
                new THREE.ConeGeometry(0.4, 1, 8),
            ];
            const colors = [0xffd700, 0xc0c0c0, 0xff1493, 0x00ff7f];

            instancedMesh = geometries.map((geo, idx) => {
                const mesh = new THREE.InstancedMesh(
                    geo,
                    new THREE.MeshPhysicalMaterial({
                        color: colors[idx % colors.length],
                        metalness: 0.9,
                        roughness: 0.1,
                        emissive: colors[idx % colors.length],
                        emissiveIntensity: 0.3,
                    }),
                    instancesPerLayer
                );

                const matrix = new THREE.Matrix4();
                const positions = new Float32Array(instancesPerLayer * 3);
                const layerDivisor = instancesPerLayer / layerCount;

                for (let i = 0; i < instancesPerLayer; i++) {
                    const layer = Math.floor(i / layerDivisor);
                    const radius = 100 + layer * 80;
                    const angle = (Math.PI * 2 * i) / layerDivisor;
                    const height = -150 + layer * 100 + (Math.random() - 0.5) * 20;
                    const cosAngle = Math.cos(angle);
                    const sinAngle = Math.sin(angle);

                    const x = cosAngle * radius + (Math.random() - 0.5) * 50;
                    const y = height;
                    const z = sinAngle * radius + (Math.random() - 0.5) * 50;

                    const posIdx = i * 3;
                    positions[posIdx] = x;
                    positions[posIdx + 1] = y;
                    positions[posIdx + 2] = z;

                    matrix.setPosition(x, y, z);
                    matrix.scale(1 + Math.random() * 0.5);
                    mesh.setMatrixAt(i, matrix);
                }

                mesh.instanceMatrix.needsUpdate = true;
                scene.add(mesh);

                return { mesh, positions, targetPositions: new Float32Array(positions) };
            });
        }

        // ==================== 手势交互 ====================
        async function initHandTracking() {
            cameraVideo = document.getElementById('camera-video');
            cameraCanvas = document.getElementById('camera-canvas');
            if (!cameraCanvas) return;
            cameraCtx = cameraCanvas.getContext('2d');
            cameraCanvas.width = 200;
            cameraCanvas.height = 150;

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7,
            });

            hands.onResults((results) => {
                if (!cameraCtx) return;

                cameraCtx.save();
                cameraCtx.clearRect(0, 0, cameraCanvas.width, cameraCanvas.height);
                cameraCtx.drawImage(results.image, 0, 0, cameraCanvas.width, cameraCanvas.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const handedness = results.multiHandedness[0];

                    // 绘制手部骨骼
                    cameraCtx.strokeStyle = '#ffd700';
                    cameraCtx.lineWidth = 2;

                    const connections = [
                        [0, 1, 2, 3, 4],
                        [0, 5, 6, 7, 8],
                        [5, 9, 10, 11, 12],
                        [9, 13, 14, 15, 16],
                        [13, 17, 18, 19, 20],
                        [0, 17]
                    ];

                    connections.forEach(connection => {
                        for (let i = 0; i < connection.length - 1; i++) {
                            const start = landmarks[connection[i]];
                            const end = landmarks[connection[i + 1]];
                            cameraCtx.beginPath();
                            cameraCtx.moveTo(start.x * cameraCanvas.width, start.y * cameraCanvas.height);
                            cameraCtx.lineTo(end.x * cameraCanvas.width, end.y * cameraCanvas.height);
                            cameraCtx.stroke();
                        }
                    });

                    // 识别手势
                    detectGesture(landmarks);
                }

                cameraCtx.restore();
            });

            const camera = new Camera(cameraVideo, {
                onFrame: async () => {
                    await hands.send({ image: cameraVideo });
                },
                width: 1280,
                height: 720,
            });

            await camera.start();
            handTracker = { hands, camera };
        }

        function detectGesture(landmarks) {
            // 计算手指数量
            const fingerTips = [4, 8, 12, 16, 20];
            const fingerBases = [3, 6, 10, 14, 18];
            let fingerCount = 0;

            fingerTips.forEach((tip, idx) => {
                if (landmarks[tip].y < landmarks[fingerBases[idx]].y) {
                    fingerCount++;
                }
            });

            // 计算手掌中心
            const center = landmarks.reduce(
                (sum, point) => {
                    sum.x += point.x;
                    sum.y += point.y;
                    sum.z += point.z;
                    return sum;
                },
                { x: 0, y: 0, z: 0 }
            );
            center.x /= landmarks.length;
            center.y /= landmarks.length;
            center.z /= landmarks.length;

            handCenter = {
                x: (center.x - 0.5) * 2,
                y: (0.5 - center.y) * 2,
                z: center.z
            };

            // 判断手势（带防抖）
            const now = Date.now();
            if (now - lastGestureTime < CONFIG.GESTURE.COOLDOWN) return;

            if (fingerCount <= 1 && handState !== 'fist') {
                handState = 'fist';
                lastGestureTime = now;
                showStatus('握拳：聚合蛋糕', 1000);
                aggregateCake();
            } else if (fingerCount >= 4 && handState !== 'open') {
                handState = 'open';
                lastGestureTime = now;
                showStatus('张开：散开星云', 1000);
                scatterCake();
            } else if (fingerCount >= 2 && fingerCount <= 3 && handState !== 'pinch') {
                handState = 'pinch';
                lastGestureTime = now;
                if (userPhotos.length > 0) {
                    showStatus('捏合：聚焦照片', 1000);
                    focusOnPhoto();
                }
            }
        }

        function aggregateCake() {
            if (!instancedMesh) return;

            instancedMesh.forEach((layer, layerIdx) => {
                const layerCount = 3;
                const instancesPerLayer = layer.positions.length / 3;

                for (let i = 0; i < instancesPerLayer; i++) {
                    const targetLayer = Math.floor(i / (instancesPerLayer / layerCount));
                    const radius = 100 + targetLayer * 80;
                    const angle = (Math.PI * 2 * i) / (instancesPerLayer / layerCount);
                    const height = -150 + targetLayer * 100;

                    const x = Math.cos(angle) * radius;
                    const y = height;
                    const z = Math.sin(angle) * radius;

                    layer.targetPositions[i * 3] = x;
                    layer.targetPositions[i * 3 + 1] = y;
                    layer.targetPositions[i * 3 + 2] = z;
                }
            });
        }

        function scatterCake() {
            if (!instancedMesh) return;

            instancedMesh.forEach((layer) => {
                const instancesPerLayer = layer.positions.length / 3;

                for (let i = 0; i < instancesPerLayer; i++) {
                    const radius = 400 + Math.random() * 200;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(Math.random() * 2 - 1);

                    // 球坐标转笛卡尔坐标
                    layer.targetPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    layer.targetPositions[i * 3 + 1] = radius * Math.cos(phi);
                    layer.targetPositions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
                }
            });
        }

        // ==================== 动画循环 ====================
        let animationRunning = false;
        function animate() {
            if (!animationRunning) {
                animationRunning = true;
                console.log('动画循环已启动');
            }
            requestAnimationFrame(animate);

            if (currentPhase === 'intro' && particleSystem?.geometry && targets) {
                const positionArray = particleSystem.geometry.attributes.position.array;
                const cfg = CONFIG.ANIMATION;
                const dt = Math.min(cfg.DT_MAX, cfg.DT_MIN);

                for (let i = 0; i < particleCount; i++) {
                    const idx = i * 3;
                    const targetX = targets[idx] || 0;
                    const targetY = targets[idx + 1] || 0;
                    const targetZ = targets[idx + 2] || 0;
                    const currentX = positionArray[idx] || 0;
                    const currentY = positionArray[idx + 1] || 0;
                    const currentZ = positionArray[idx + 2] || 0;

                    const dx = targetX - currentX;
                    const dy = targetY - currentY;
                    const dz = targetZ - currentZ;
                    const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (distance < cfg.DISTANCE_THRESHOLD) {
                        positionArray[idx] = targetX;
                        positionArray[idx + 1] = targetY;
                        positionArray[idx + 2] = targetZ;
                        velocities[idx] = velocities[idx + 1] = velocities[idx + 2] = 0;
                        continue;
                    }

                    const speedFactor = Math.min(1, distance / 150) * cfg.SPEED_FACTOR_MULT + cfg.SPEED_FACTOR_BASE;
                    const vx = (velocities[idx] || 0) + dx * speedFactor * dt;
                    const vy = (velocities[idx + 1] || 0) + dy * speedFactor * dt;
                    const vz = (velocities[idx + 2] || 0) + dz * speedFactor * dt;

                    const damping = distance > 200 ? cfg.DAMPING_FAR : (distance > 50 ? cfg.DAMPING_MID : cfg.DAMPING_NEAR);
                    velocities[idx] = vx * damping;
                    velocities[idx + 1] = vy * damping;
                    velocities[idx + 2] = vz * damping;

                    positionArray[idx] = currentX + velocities[idx];
                    positionArray[idx + 1] = currentY + velocities[idx + 1];
                    positionArray[idx + 2] = currentZ + velocities[idx + 2];
                }

                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            if (currentPhase === 'main' && instancedMesh) {
                const cfg = CONFIG.ANIMATION;
                instancedMesh.forEach((layer) => {
                    const instancesPerLayer = layer.positions.length / 3;
                    const matrix = new THREE.Matrix4();

                    for (let i = 0; i < instancesPerLayer; i++) {
                        const idx = i * 3;
                        const targetX = layer.targetPositions[idx];
                        const targetY = layer.targetPositions[idx + 1];
                        const targetZ = layer.targetPositions[idx + 2];

                        layer.positions[idx] += (targetX - layer.positions[idx]) * cfg.CAKE_LERP;
                        layer.positions[idx + 1] += (targetY - layer.positions[idx + 1]) * cfg.CAKE_LERP;
                        layer.positions[idx + 2] += (targetZ - layer.positions[idx + 2]) * cfg.CAKE_LERP;

                        matrix.setPosition(
                            layer.positions[idx],
                            layer.positions[idx + 1],
                            layer.positions[idx + 2]
                        );
                        matrix.scale(1 + Math.random() * 0.5);
                        layer.mesh.setMatrixAt(i, matrix);
                    }

                    layer.mesh.instanceMatrix.needsUpdate = true;
                });

                if (handState === 'open' && handCenter) {
                    const targetRotationY = sceneRotation.y + handCenter.x * cfg.HAND_ROTATION_SENSITIVITY;
                    const targetRotationX = sceneRotation.x + handCenter.y * cfg.HAND_ROTATION_SENSITIVITY;

                    sceneRotation.y += (targetRotationY - sceneRotation.y) * cfg.HAND_ROTATION_SMOOTH;
                    sceneRotation.x += (targetRotationX - sceneRotation.x) * cfg.HAND_ROTATION_SMOOTH;
                }

                scene.rotation.x = sceneRotation.x;
                scene.rotation.y = sceneRotation.y;
            }

            // 渲染场景
            if (composer && scene && camera) {
                try {
                    composer.render();
                } catch (e) {
                    // 如果 composer 渲染失败，使用基础渲染
                    if (renderer && scene && camera) {
                        renderer.render(scene, camera);
                    }
                }
            } else if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            if (renderer) {
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            if (composer) {
                composer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // ==================== 初始化 ====================
        async function init() {
            try {
                console.log('开始初始化...');
                initDOMCache();

                if (!THREE) {
                    console.error('Three.js 未加载');
                    return;
                }

                animate();
                initScene();
                initPhotoUpload();

                await new Promise(resolve => setTimeout(resolve, 300));

                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                    console.log('初始场景渲染完成');
                    console.log('场景子对象数量:', scene.children.length);
                    console.log('场景子对象:', scene.children.map(c => c.type));
                }

                console.log('粒子系统状态:', {
                    exists: !!particleSystem,
                    geometry: !!particleSystem?.geometry,
                    material: !!particleSystem?.material,
                    inScene: scene.children.includes(particleSystem),
                    particleCount: particleSystem?.geometry?.attributes?.position?.count / 3
                });

                for (let i = 0; i < 5; i++) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                    if (renderer && scene && camera) {
                        (composer || renderer).render(scene, camera);
                    }
                }
                console.log('强制渲染完成');

                if (DOM.startScreen) {
                    DOM.startScreen.classList.remove('hidden');
                }

                console.log('等待用户点击开始按钮...');
            } catch (error) {
                console.error('初始化错误:', error);
                console.error('错误堆栈:', error.stack);
                showStatus('初始化失败: ' + (error.message || '未知错误') + '，请查看控制台（F12）', 10000);
            }
        }

        // 启动应用
        async function startApp() {
            console.log('准备启动应用...');
            // 等待 DOM 加载完成
            if (document.readyState === 'loading') {
                await new Promise(resolve => {
                    window.addEventListener('DOMContentLoaded', resolve);
                });
            }

            // 等待可选模块加载完成（最多等待2秒）
            try {
                await Promise.race([
                    modulesLoadingPromise,
                    new Promise(resolve => setTimeout(resolve, 2000)) // 最多等待2秒
                ]);
            } catch (e) {
                console.warn('模块加载等待出错:', e);
            }

            console.log('开始初始化应用');
            console.log('THREE:', typeof THREE);
            console.log('EffectComposer:', typeof EffectComposer);
            console.log('GSAP:', gsap ? '已加载' : '未加载');

            await init();

            // 设置开始按钮事件
            setupStartButton();
        }

        // 设置开始按钮事件
        function setupStartButton() {
            if (DOM.startBtn) {
                DOM.startBtn.addEventListener('click', async () => {
                    console.log('用户点击开始按钮');
                    if (DOM.startScreen) {
                        DOM.startScreen.classList.add('hidden');
                    }

                    await startIntroSequence();

                    if (Hands && Camera) {
                        try {
                            await initHandTracking();
                        } catch (handError) {
                            console.warn('手势识别初始化失败:', handError);
                            showStatus('手势识别未启用，其他功能正常', 3000);
                        }
                    } else {
                        console.warn('MediaPipe 未加载，跳过手势识别');
                        showStatus('手势识别不可用（MediaPipe 未加载）', 3000);
                    }
                });
            }

            if (DOM.startUploadBtn && DOM.fileInput) {
                DOM.startUploadBtn.addEventListener('click', () => {
                    DOM.fileInput.click();
                });
            }
        }

        // 立即启动（模块导入完成后）
        startApp().catch(error => {
            console.error('应用启动失败:', error);
            // 启动失败
            showStatus('应用启动失败，请刷新页面', 10000);
        });
    </script>
</body>

</html>
