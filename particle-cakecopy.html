      
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 粒子蛋糕互动体验</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #ffd700;
            overflow: hidden;
            position: relative;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
            transition: opacity 0.8s ease;
            /* 确保背景是黑色 */
        }

        #canvas-container.fade-out {
            opacity: 0;
            pointer-events: none;
        }


        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease;
        }

        #fireworks-canvas.active {
            opacity: 1;
            visibility: visible;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .ui-element {
            pointer-events: auto;
        }

        #gui-panel {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 30;
            pointer-events: auto;
        }

        #gui-panel.gui-hidden {
            opacity: 0;
            pointer-events: none;
        }


        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
            /* 完全隐藏，不占用空间 */
        }

        #loading-progress {
            width: 300px;
            height: 4px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 20px #ffd700;
        }

        #loading-text {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 让倒计时开始时能看到星空背景，使用半透明覆盖层 */
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            /* 默认显示 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        #start-screen.hidden {
            display: none;
        }

        #start-btn {
            padding: 18px 48px;
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 12px;
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #start-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        .star-icon {
            font-size: 18px;
        }

        #status-text {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #status-text.visible {
            opacity: 1;
        }

        .glow-text {
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ffd700;
        }
    </style>
</head>

<body>
    <div id="start-screen">
        <button id="start-btn" class="ui-element">
            <span>开启 2026</span>
            <span class="star-icon">⭐</span>
        </button>
    </div>

    <div id="canvas-container"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div id="ui-overlay">
        <div id="status-text"></div>
        <div id="gui-panel" class="ui-element gui-hidden"></div>
    </div>


    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.esm.js"
      }
    }
  </script>

    <script type="module">
        // ==================== 配置常量 ====================
        const CONFIG = {
            PARTICLE: {
                COUNT: 20000,
                SIZE: 2,
                COLOR: 0xffd700,
                OPACITY: 1.0,
                INIT_RADIUS_MIN: 500,
                INIT_RADIUS_MAX: 800,
                SCATTER_RADIUS_MIN: 400,
                SCATTER_RADIUS_MAX: 700,
                BACKGROUND_RADIUS_MIN: 350,
                BACKGROUND_RADIUS_MAX: 800
            },
            CAMERA: {
                FOV: 55,
                NEAR: 0.1,
                FAR: 2000,
                INIT_Z: 600,
                TARGET_Z_MAIN: 800
            },
            INTRO: {
                COUNTDOWN: ['5', '4', '3', '2', '1', '2026'],
                GATHER_DURATION: 900,
                HOLD_DURATION: 550,
                HOLD_DURATION_2026: 1500,  // 2026 文字保持显示的时间（毫秒）
                INITIAL_DELAY: 500,
                FONT_SIZE_NORMAL: 240,
                FONT_SIZE_2026: 220,
                SCALE_NORMAL: 1.5,
                SCALE_2026: 2.0
            },
            TEXT_TO_POSITIONS: {
                CANVAS_WIDTH: 2048,
                CANVAS_HEIGHT: 512,
                STEP: 2,
                ALPHA_THRESHOLD: 100,
                BASE_SCALE: 0.75
            },
            ANIMATION: {
                DT_MAX: 0.016,
                DT_MIN: 0.05,
                DISTANCE_THRESHOLD: 0.5,
                SPEED_FACTOR_BASE: 0.15,
                SPEED_FACTOR_MULT: 0.3,
                DAMPING_FAR: 0.82,
                DAMPING_MID: 0.88,
                DAMPING_NEAR: 0.92,
                CAKE_LERP: 0.05
            },
            FIREWORKS: {
                DURATION: 7000,  // 缩短烟花持续时间，加快转场
                MAX_PARTICLES: 2200,
                MAX_FIREWORKS: 10,
                STAR_COUNT: 150
            },
            CAKE: {
                LAYER_COUNT: 3,
                POINTS_PER_LAYER: 2000,
                DUST_COUNT: 2000,
                STAR_COUNT: 3000,
                FLOATING_TEXT: '2026祝你开心',
                FLOATING_TEXT_SIZE: 90,
                // 变大的话，文字会更高
                FLOATING_TEXT_Y: 380, 
                // 变小的话，蛋糕会往下；已调整为更靠上，避免触底
                VERTICAL_OFFSET: -160,
                // 以弧度/秒为单位的绕 Y 轴旋转速度（0.52 ≈ 每 12 秒转一圈）
                ROTATION_SPEED: 0.52
            },
        };

        // 模块导入
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/postprocessing/ShaderPass.js';
        import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';

        // 可选模块（可能加载失败）
        let gsap = null;
        let modulesLoadingPromise = null;

        // 异步加载可选模块
        async function loadGsapWithFallback() {
            const sources = [
                'gsap',
                'https://cdn.skypack.dev/gsap@3.12.5?min',
                'https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js'
            ];
            for (const src of sources) {
                try {
                    const module = await import(src);
                    const candidate = module.gsap || module.default || module;
                    if (candidate && typeof candidate.to === 'function') {
                        console.log('GSAP 加载成功，来源:', src);
                        return candidate;
                    }
                } catch (error) {
                    console.warn(`GSAP 源 ${src} 加载失败:`, error);
                }
            }
            return null;
        }

        modulesLoadingPromise = Promise.allSettled([
            loadGsapWithFallback().then(instance => { gsap = instance; })
        ]).then(() => {
            console.log('所有可选模块加载尝试完成');
            console.log('GSAP 状态:', gsap && typeof gsap.to === 'function' ? '已加载且可用' : '未加载或不可用');
        });

        // ==================== 全局变量 ====================
        let scene, camera, renderer, composer;
        let particleSystem, cakePoints, floatingTextMesh = null;
        let cakeGroup = null;
        // 是否启用蛋糕持续自转（在进入主场景时设置为 true）
        let cakeAutoRotate = false;
        let cakePointCount = 0;
        let cakeBasePositions = null;
        let cakeTargetPositions = null;
        // 用于在倒计时阶段隐藏背景粒子（把它们移动到视野外）
        const OFFSCREEN_POS = 1e6; // 足够大的数值，位于摄像机视锥之外
        // 持久化星空和金色微尘引用，便于显示控制
        let starField = null;
        let goldDust = null;
        let cakePositionAttribute = null;
        // 全局保存蜡烛组，以便在不同阶段控制显示
        let cakeCandleGroup = null;
        let fireworksCanvas, fireworksEngine;
        let currentPhase = 'intro'; // intro, fireworks, main
        const particleCount = CONFIG.PARTICLE.COUNT;
        let positions, velocities, targets;
        let sceneRotation = { x: 0, y: 0 };


        // DOM元素缓存
        const DOM = {
            statusText: null,
            startBtn: null,
            startScreen: null,
            loadingScreen: null,
            canvasContainer: null,
            guiPanel: null
        };

        // 初始化DOM缓存
        function initDOMCache() {
            DOM.statusText = document.getElementById('status-text');
            DOM.startBtn = document.getElementById('start-btn');
            DOM.startScreen = document.getElementById('start-screen');
            DOM.loadingScreen = document.getElementById('loading-screen');
            DOM.canvasContainer = document.getElementById('canvas-container');

            DOM.guiPanel = document.getElementById('gui-panel');
        }

        // ==================== 工具函数 ====================
        function showStatus(text, duration = 2000) {
            if (!DOM.statusText) return;
            DOM.statusText.textContent = text;
            DOM.statusText.classList.add('visible');
            setTimeout(() => {
                if (DOM.statusText) {
                    DOM.statusText.classList.remove('visible');
                }
            }, duration);
        }

        function textToPositions(text, fontSize = 200, scaleMultiplier = 1.0, letterSpacing = 0, useBold = true) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const cfg = CONFIG.TEXT_TO_POSITIONS;
            canvas.width = cfg.CANVAS_WIDTH;
            canvas.height = cfg.CANVAS_HEIGHT;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.textBaseline = 'middle';
            
            // 使用更优雅的字体，去掉粗体或使用更细的字体
            const fontWeight = useBold ? 'bold' : 'normal';
            // 使用更优雅的字体族，优先使用系统字体
            ctx.font = `${fontWeight} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif`;
            
            // 如果设置了字间距，需要逐个字符绘制
            if (letterSpacing > 0) {
                ctx.textAlign = 'left';
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                let currentX = centerX;
                
                // 先测量总宽度，以便居中
                let totalWidth = 0;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const metrics = ctx.measureText(char);
                    totalWidth += metrics.width + (i < text.length - 1 ? letterSpacing : 0);
                }
                
                // 从中心向左偏移一半宽度，开始绘制
                currentX = centerX - totalWidth / 2;
                
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    ctx.fillText(char, currentX, centerY);
                    const metrics = ctx.measureText(char);
                    currentX += metrics.width + letterSpacing;
                }
            } else {
                ctx.textAlign = 'center';
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            }

            const positions = [];
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const halfWidth = canvas.width / 2;
            const halfHeight = canvas.height / 2;
            const scale = cfg.BASE_SCALE * scaleMultiplier;

            for (let y = 0; y < canvas.height; y += cfg.STEP) {
                const yOffset = y * canvas.width;
                for (let x = 0; x < canvas.width; x += cfg.STEP) {
                    const alpha = data[(yOffset + x) * 4 + 3];
                    if (alpha > cfg.ALPHA_THRESHOLD) {
                        positions.push((x - halfWidth) * scale);
                        positions.push((halfHeight - y) * scale);
                        positions.push(0);
                    }
                }
            }

            console.log(`文本 "${text}" 提取了 ${positions.length / 3} 个粒子位置，缩放倍数: ${scaleMultiplier}, 字间距: ${letterSpacing}`);
            return new Float32Array(positions);
        }

        function getVisibleHeightAtDepth(depth = 0) {
            if (!camera) {
                const fallbackFov = THREE.MathUtils.degToRad(55);
                const fallbackDistance = Math.abs(600 - depth);
                return 2 * Math.tan(fallbackFov / 2) * Math.max(fallbackDistance, 0.1);
            }
            const distance = Math.abs(camera.position.z - depth);
            const vFov = THREE.MathUtils.degToRad(camera.fov);
            return 2 * Math.tan(vFov / 2) * Math.max(distance, 0.1);
        }

        function getVisibleWidthAtDepth(depth = 0) {
            const height = getVisibleHeightAtDepth(depth);
            if (camera) {
                return height * camera.aspect;
            }
            const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
            return height * aspect;
        }

        // ==================== 初始化场景 ====================
        function initScene() {
            try {
                if (!DOM.canvasContainer) {
                    throw new Error('找不到 canvas-container 元素');
                }

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000000);

                const cfg = CONFIG.CAMERA;
                camera = new THREE.PerspectiveCamera(
                    cfg.FOV,
                    window.innerWidth / window.innerHeight,
                    cfg.NEAR,
                    cfg.FAR
                );
                camera.position.set(0, 0, cfg.INIT_Z);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                DOM.canvasContainer.appendChild(renderer.domElement);

                console.log('Three.js 场景初始化完成');
            } catch (error) {
                console.error('场景初始化错误:', error);
                throw error;
            }

            // Post-processing
            try {
                composer = new EffectComposer(renderer);
                composer.addPass(new RenderPass(scene, camera));
                composer.addPass(new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    1.5, 0.4, 0.85
                ));
                console.log('后处理效果初始化完成');
            } catch (error) {
                console.warn('后处理效果初始化失败，将使用基础渲染:', error);
                composer = null;
            }

            initParticles();
            createCakeStructure();
            createGoldDust();
            createStarField();
            createFloatingText();
            initPostProcessing();
            window.addEventListener('resize', onWindowResize);
        }

        function initParticles() {
            console.log('初始化粒子系统，粒子数量:', particleCount);
            const cfg = CONFIG.PARTICLE;
            positions = new Float32Array(particleCount * 3);
            velocities = new Float32Array(particleCount * 3);
            targets = new Float32Array(particleCount * 3);

            const radiusRange = cfg.INIT_RADIUS_MAX - cfg.INIT_RADIUS_MIN;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                const radius = cfg.INIT_RADIUS_MIN + Math.random() * radiusRange;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const sinPhi = Math.sin(phi);

                positions[idx] = radius * sinPhi * Math.cos(theta);
                positions[idx + 1] = radius * Math.cos(phi);
                positions[idx + 2] = radius * sinPhi * Math.sin(theta);

                targets[idx] = positions[idx];
                targets[idx + 1] = positions[idx + 1];
                targets[idx + 2] = positions[idx + 2];
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: cfg.SIZE,
                color: cfg.COLOR,
                transparent: true,
                opacity: cfg.OPACITY,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            console.log('粒子系统已添加到场景，粒子数:', particleSystem.geometry.attributes.position.count / 3);
        }

        function initPostProcessing() {
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            // 添加点光源
            const pointLight = new THREE.PointLight(0xffd700, 2, 1000);
            pointLight.position.set(0, 0, 500);
            scene.add(pointLight);
        }

        // ==================== 倒计时序列 ====================
        async function startIntroSequence() {
            console.log('开始倒计时序列');
            currentPhase = 'intro';

            // 确保倒计时使用的星空为可见状态（从开始到倒计时期间保持）
            if (starField) {
                starField.visible = true;
                console.log('startIntroSequence: starField visible');
            }

            if (!particleSystem) {
                console.error('粒子系统未创建！');
                return;
            }

            if (DOM.loadingScreen) {
                DOM.loadingScreen.style.transition = 'opacity 1s ease-out';
                DOM.loadingScreen.style.opacity = '0.3';
                setTimeout(() => {
                    if (DOM.loadingScreen) {
                        DOM.loadingScreen.classList.add('hidden');
                        console.log('加载屏幕已隐藏');
                    }
                }, 1500);
            }

            console.log('显示初始粒子云...');
            scatterParticles();
            await new Promise(resolve => setTimeout(resolve, CONFIG.INTRO.INITIAL_DELAY));

            const cfg = CONFIG.INTRO;
            const countdown = cfg.COUNTDOWN;

            for (let i = 0; i < countdown.length; i++) {
                const text = countdown[i];
                console.log(`显示倒计时: ${text}`);

                const is2026 = text === '2026';
                const fontSize = is2026 ? cfg.FONT_SIZE_2026 : cfg.FONT_SIZE_NORMAL;
                const scale = is2026 ? cfg.SCALE_2026 : cfg.SCALE_NORMAL;
                const textPositions = textToPositions(text, fontSize, scale);
                console.log(`文本 "${text}" 生成 ${textPositions.length / 3} 个粒子位置`);

                // 特殊处理：仅对 '2026' 使用隐藏背景与随机化映射以保证整体同时出现
                if (text === '2026') {
                    retargetParticles(textPositions, { hideBackground: true, shuffle: true });
                } else {
                    // 其他数字使用常规映射并保留背景粒子
                    retargetParticles(textPositions, { hideBackground: false, shuffle: false });
                }

                await new Promise(resolve => setTimeout(resolve, cfg.GATHER_DURATION));
                console.log(`步骤2: 保持数字 "${text}"`);
                // 2026 使用更长的保持时间
                const holdTime = is2026 ? (cfg.HOLD_DURATION_2026 || cfg.HOLD_DURATION) : cfg.HOLD_DURATION;
                await new Promise(resolve => setTimeout(resolve, holdTime));

                if (i < countdown.length - 1) {
                    console.log(`步骤3: 准备下一个数字`);
                    // 将当前用于数字的粒子散开，为下一个数字腾出位置；保持背景（如果存在）不隐藏
                    const thisTextParticleCount = Math.min(textPositions.length / 3, particleCount);
                    scatterParticles(thisTextParticleCount, false);
                }
            }

            // -------------- 粒子消散（替代 Warp） --------------
            await (async () => {
            const fadeMS = 800;                // 总淡出时长
            const step   = 50;                 // 每帧间隔
            const steps  = fadeMS / step;

            scatterParticles();                // ① 吹散（已有函数）
            for (let i = 0; i <= steps; i++) { // ② 淡出
                if (particleSystem) {
                particleSystem.material.opacity = 1 - i / steps;
                }
                await new Promise(r => setTimeout(r, step));
            }
            // ③ 清理
            if (particleSystem) {
                scene.remove(particleSystem);
                particleSystem.geometry.dispose();
                particleSystem.material.dispose();
                particleSystem = null;
            }
            })();
            // ----------------------------------------------------

            await fireworksTransition();
        }

        // 可以选择只散开前 N 个粒子（用于倒计时只对组成数字的粒子做动画），或在隐藏背景时把其余粒子移出视野
        function scatterParticles(countLimit = null, hideBackground = false) {
            console.log('粒子散开...', { countLimit, hideBackground });
            const cfg = CONFIG.PARTICLE;
            const radiusRange = cfg.SCATTER_RADIUS_MAX - cfg.SCATTER_RADIUS_MIN;
            const limit = (typeof countLimit === 'number' && countLimit >= 0) ? Math.min(countLimit, particleCount) : particleCount;

            for (let i = 0; i < limit; i++) {
                const idx = i * 3;
                const radius = cfg.SCATTER_RADIUS_MIN + Math.random() * radiusRange;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const sinPhi = Math.sin(phi);

                targets[idx] = radius * sinPhi * Math.cos(theta);
                targets[idx + 1] = radius * Math.cos(phi);
                targets[idx + 2] = radius * sinPhi * Math.sin(theta);
            }

            if (hideBackground) {
                for (let i = limit; i < particleCount; i++) {
                    const idx = i * 3;
                    targets[idx] = OFFSCREEN_POS;
                    targets[idx + 1] = OFFSCREEN_POS;
                    targets[idx + 2] = OFFSCREEN_POS;
                    // 立即也把位置移出，避免等待动画才消失
                    if (particleSystem && particleSystem.geometry && particleSystem.geometry.attributes.position) {
                        const posArr = particleSystem.geometry.attributes.position.array;
                        posArr[idx] = OFFSCREEN_POS;
                        posArr[idx + 1] = OFFSCREEN_POS;
                        posArr[idx + 2] = OFFSCREEN_POS;
                        particleSystem.geometry.attributes.position.needsUpdate = true;
                    }
                }
            }
        }

        function retargetParticles(newTargets, options = {}) {
            const hideBackground = !!options.hideBackground;
            const shuffle = !!options.shuffle;
            const targetCount = newTargets.length / 3;
            console.log(`重新定位粒子: 目标位置数=${targetCount}, 粒子数=${particleCount}`, { hideBackground, shuffle });

            if (targetCount === 0) {
                console.warn('目标位置为空！');
                return;
            }

            const textParticleCount = Math.min(targetCount, particleCount);
            const backgroundParticleCount = particleCount - textParticleCount;
            const cfg = CONFIG.PARTICLE;
            const bgRadiusRange = cfg.BACKGROUND_RADIUS_MAX - cfg.BACKGROUND_RADIUS_MIN;

            // 生成粒子索引数组
            const indices = Array.from({ length: particleCount }, (_, i) => i);

            if (shuffle) {
                // 随机打乱索引（只在需要时启用，如 '2026'）
                for (let i = indices.length - 1; i > 0; i--) {
                    const r = Math.floor(Math.random() * (i + 1));
                    const tmp = indices[i]; indices[i] = indices[r]; indices[r] = tmp;
                }

                // 将文本目标均匀映射到前 textParticleCount 个随机粒子上
                for (let t = 0; t < textParticleCount; t++) {
                    const srcIdx = Math.floor(t * targetCount / textParticleCount) * 3;
                    const particleIdx = indices[t];
                    const dst = particleIdx * 3;
                    targets[dst] = newTargets[srcIdx] || 0;
                    targets[dst + 1] = newTargets[srcIdx + 1] || 0;
                    targets[dst + 2] = newTargets[srcIdx + 2] || 0;
                }

                // 处理剩余粒子
                for (let k = textParticleCount; k < particleCount; k++) {
                    const particleIdx = indices[k];
                    const dst = particleIdx * 3;
                    if (hideBackground) {
                        targets[dst] = OFFSCREEN_POS;
                        targets[dst + 1] = OFFSCREEN_POS;
                        targets[dst + 2] = OFFSCREEN_POS;
                        if (particleSystem && particleSystem.geometry && particleSystem.geometry.attributes.position) {
                            const posArr = particleSystem.geometry.attributes.position.array;
                            posArr[dst] = OFFSCREEN_POS;
                            posArr[dst + 1] = OFFSCREEN_POS;
                            posArr[dst + 2] = OFFSCREEN_POS;
                        }
                    } else {
                        const radius = cfg.BACKGROUND_RADIUS_MIN + Math.random() * bgRadiusRange;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(Math.random() * 2 - 1);
                        const sinPhi = Math.sin(phi);

                        targets[dst] = radius * sinPhi * Math.cos(theta);
                        targets[dst + 1] = radius * Math.cos(phi);
                        targets[dst + 2] = radius * sinPhi * Math.sin(theta);
                    }
                }
            } else {
                // 非随机映射：按顺序把目标位置赋给前 textParticleCount 个粒子，保持原先效果（避免丢失数字）
                const assignCount = textParticleCount;
                const step = Math.max(1, Math.floor(targetCount / assignCount));
                for (let i = 0; i < assignCount; i++) {
                    const srcIdx = Math.min((i * step) * 3, (targetCount - 1) * 3);
                    const dst = i * 3;
                    targets[dst] = newTargets[srcIdx] || 0;
                    targets[dst + 1] = newTargets[srcIdx + 1] || 0;
                    targets[dst + 2] = newTargets[srcIdx + 2] || 0;
                }

                // 剩余粒子按背景规则填充或隐藏
                for (let i = assignCount; i < particleCount; i++) {
                    const dst = i * 3;
                    if (hideBackground) {
                        targets[dst] = OFFSCREEN_POS;
                        targets[dst + 1] = OFFSCREEN_POS;
                        targets[dst + 2] = OFFSCREEN_POS;
                        if (particleSystem && particleSystem.geometry && particleSystem.geometry.attributes.position) {
                            const posArr = particleSystem.geometry.attributes.position.array;
                            posArr[dst] = OFFSCREEN_POS;
                            posArr[dst + 1] = OFFSCREEN_POS;
                            posArr[dst + 2] = OFFSCREEN_POS;
                        }
                    } else {
                        const radius = cfg.BACKGROUND_RADIUS_MIN + Math.random() * bgRadiusRange;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(Math.random() * 2 - 1);
                        const sinPhi = Math.sin(phi);

                        targets[dst] = radius * sinPhi * Math.cos(theta);
                        targets[dst + 1] = radius * Math.cos(phi);
                        targets[dst + 2] = radius * sinPhi * Math.sin(theta);
                    }
                }
            }

            if (particleSystem && particleSystem.geometry && particleSystem.geometry.attributes.position) {
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            console.log(`粒子重新定位完成: ${textParticleCount} 个形成数字, ${backgroundParticleCount} 个作为背景`, { hideBackground, shuffle });
        }

        // ==================== Canvas 烟花系统 ====================
        // 限定颜色分量到合法范围 0-255
        function clampColor(value) { return Math.max(0, Math.min(255, Math.round(value))); }

        // 将 #rrggbb 或 #rgb 转为 {r,g,b}
        function hexToRgbColor(hex) {
            if (!hex) return { r: 255, g: 255, b: 255 };
            const normalized = hex.replace('#', '');
            const expanded = normalized.length === 3 ? normalized.replace(/(.)/g, '$1$1') : normalized;
            const bigint = parseInt(expanded, 16);
            return { r: clampColor((bigint >> 16) & 255), g: clampColor((bigint >> 8) & 255), b: clampColor(bigint & 255) };
        }

        // 随机扰动 RGB 值（用于色彩变化）
        function jitterRgb(rgb, amount = 20) { return { r: clampColor(rgb.r + (Math.random() - 0.5) * amount * 2), g: clampColor(rgb.g + (Math.random() - 0.5) * amount * 2), b: clampColor(rgb.b + (Math.random() - 0.5) * amount * 2) }; }

        // 将 rgb 对象转为 CSS rgba 字符串
        function rgbToString(rgb, alpha = 1) { return `rgba(${Math.round(rgb.r)}, ${Math.round(rgb.g)}, ${Math.round(rgb.b)}, ${Math.max(0, Math.min(1, alpha))})`; }

        // 小工具：在区间内随机浮点数
        function randRange(min, max) { return min + Math.random() * (max - min); }
        // 小工具：随机选择数组元素
        function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        /**
         * FireworkParticle: 单个烟花粒子，负责物理更新与绘制。
         * init(config) => 初始化粒子（供池化复用）。
         */
        class FireworkParticle {
            constructor(engine) { this.engine = engine; this.active = false; }

            init(config = {}) {
                const {
                    x, y, vx, vy,
                    size = 3, alpha = 1, lifespan = 1.5,
                    gravity = 0.12, resistance = 0.98, decay = 0.02, shrink = 0.96,
                    color = { r: 255, g: 255, b: 255 }, allowReburst = false
                } = config;

                Object.assign(this, {
                    x, y, prevX: x, prevY: y, vx, vy,
                    baseSize: size, size, alpha, life: 0, lifespan,
                    gravity: gravity * 3600, resistance, decay, shrink,
                    color, trailTimer: 0, allowReburst, reburstTriggered: false,
                    flicker: Math.random() < 0.5, flickerIntensity: 0.3 + Math.random() * 0.4,
                    sparkle: Math.random() < 0.3, sparklePhase: Math.random() * Math.PI * 2,
                    rotation: Math.random() * Math.PI * 2, rotationSpeed: (Math.random() - 0.5) * 0.1,
                    active: true
                });
                return this;
            }

            update(dt) {
                const frameRatio = dt / (1 / 60);
                const resPow = Math.pow(this.resistance, frameRatio);
                this.prevX = this.x; this.prevY = this.y;
                this.vx *= resPow; this.vy = this.vy * resPow + this.gravity * dt;
                this.x += this.vx * dt; this.y += this.vy * dt;
                this.life += dt; this.rotation += this.rotationSpeed * dt;

                this.size = Math.max(0, this.size * Math.pow(this.shrink, frameRatio));
                const lifeProgress = this.life / this.lifespan;
                let baseAlpha = Math.max(0, 1 - lifeProgress * lifeProgress);
                this.alpha = Math.min(1, Math.max(0, baseAlpha * (this.alpha ?? 1)));

                if (this.flicker) this.alpha += Math.sin(this.life * 15 + Math.random() * Math.PI) * this.flickerIntensity * 0.15;
                if (this.sparkle) this.alpha += (Math.sin(this.life * 20 + this.sparklePhase) + 1) * 0.5 * 0.2;

                if (this.allowReburst && !this.reburstTriggered && this.life > this.lifespan * 0.3 && this.life < this.lifespan * 0.6 && Math.random() < 0.025) {
                    this.reburstTriggered = true; this.engine.createSubExplosion(this.x, this.y, this.color);
                }

                this.trailTimer += dt;
                if (this.trailTimer >= 0.02) {
                    this.engine.trails.push({ x: this.x, y: this.y, alpha: this.alpha * 0.5, size: Math.max(0.4, this.size * 0.5), decay: 2.5, color: rgbToString(this.color, 0.4) });
                    this.trailTimer = 0;
                }

                if (this.alpha <= 0 || this.size <= 0.1 || this.y > this.engine.height + 150 || this.x < -150 || this.x > this.engine.width + 150) {
                    this.release(); return false;
                }
                return true;
            }

            draw(ctx) { ctx.fillStyle = rgbToString(this.color, this.alpha); ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.8, this.size), 0, Math.PI * 2); ctx.fill(); }
            release() { this.active = false; this.engine.particlePool.push(this); }
        }
        /**
         * FireworksEngine: Canvas 烟花系统（保留原有 API 与可配置项）
         * 目标：精简构造与更新逻辑，保持行为不变并添加必要注释。
         */
        class FireworksEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                Object.assign(this, {
                    pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
                    width: window.innerWidth,
                    height: window.innerHeight,
                    rockets: [], particles: [], trails: [], smokes: [], coreFlashes: [],
                    screenFlash: 0, particlePool: [],
                    maxParticles: CONFIG.FIREWORKS.MAX_PARTICLES,
                    maxFireworks: CONFIG.FIREWORKS.MAX_FIREWORKS,
                    running: false, activeShow: false,
                    launchTimer: 0, nextLaunchDelay: 200 + Math.random() * 600,
                    duration: 6000, elapsed: 0, resolveShow: null, lastTime: 0
                });

                // 颜色主题池（保留原始主题集合）
                this.themeBase = [
                    { colors: ['#ffffff', '#ffd700', '#ffa500', '#ff8c00'], smoke: 'rgba(255, 210, 130, 0.2)' },
                    { colors: ['#ffffff', '#ff0000', '#ff4500', '#b22222'], smoke: 'rgba(255, 120, 120, 0.2)' },
                    { colors: ['#ffffff', '#1e90ff', '#00bfff', '#4169e1'], smoke: 'rgba(140, 190, 255, 0.18)' },
                    { colors: ['#ffffff', '#32cd32', '#00ff00', '#228b22'], smoke: 'rgba(180, 255, 200, 0.16)' },
                    { colors: ['#ffffff', '#9370db', '#ba55d3', '#8a2be2'], smoke: 'rgba(210, 180, 255, 0.2)' }
                ];

                this.loop = this.loop.bind(this);
                this.resize = this.resize.bind(this);
                this.resize();
                window.addEventListener('resize', this.resize);
            }

            // 简短工具
            randomLaunchDelay = () => randRange(200, 800);

            resize() {
                if (!this.canvas) return;
                this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                this.width = window.innerWidth; this.height = window.innerHeight;
                this.canvas.width = this.width * this.pixelRatio; this.canvas.height = this.height * this.pixelRatio;
                this.canvas.style.width = `${this.width}px`; this.canvas.style.height = `${this.height}px`;
                this.ctx.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0);
                this.generateStars();
            }

            generateStars() { const count = CONFIG.FIREWORKS.STAR_COUNT; this.stars = Array.from({ length: count }, () => ({ x: Math.random() * this.width, y: Math.random() * this.height, size: Math.random() * 2 + 0.5, alpha: 0.2 + Math.random() * 0.4 })); }

            start() { if (this.running) return; this.running = true; this.lastTime = performance.now(); requestAnimationFrame(this.loop); }
            stop(clearCanvas = true) { this.running = false; this.activeShow = false; this.resolveShow?.(); this.resolveShow = null; this.rockets = []; this.particles = []; this.trails = []; this.smokes = []; this.coreFlashes = []; this.screenFlash = 0; if (clearCanvas && this.ctx) this.ctx.clearRect(0, 0, this.width, this.height); }

            /**
             * 播放一次完整烟花表演，返回 Promise，在表演结束时 resolve
             */
            playShow(duration = 6500) {
                this.duration = duration; this.elapsed = 0; this.launchTimer = 0; this.nextLaunchDelay = this.randomLaunchDelay(); this.activeShow = true; this.launchBurst(5); if (!this.running) this.start(); return new Promise(resolve => { this.resolveShow = resolve; });
            }

            launchBurst(count) { const lanes = Math.min(count, this.maxFireworks); for (let i = 0; i < lanes; i++) { const delay = Math.random() * 300 + i * 80; setTimeout(() => { if (!this.running && !this.activeShow) return; const laneWidth = this.width / (lanes + 1); const preferredX = laneWidth * (i + 1) + (Math.random() - 0.5) * laneWidth * 0.3; this.spawnRocket(preferredX); }, delay); } }

            loop(timestamp) { if (!this.running) return; const dt = Math.min(0.05, Math.max(0.016, (timestamp - this.lastTime) / 1000 || 0.016)); this.lastTime = timestamp; this.update(dt); this.render(); requestAnimationFrame(this.loop); }

            update(dt) {
                if (this.activeShow) {
                    this.launchTimer += dt * 1000; this.elapsed += dt * 1000;
                    if (this.launchTimer >= this.nextLaunchDelay) { this.launchTimer = 0; this.nextLaunchDelay = this.randomLaunchDelay(); this.spawnRocket(); }
                    if (this.elapsed >= this.duration) this.activeShow = false;
                }
                this.updateRockets(dt); this.updateParticles(dt); this.updateTrails(dt); this.updateSmoke(dt); this.updateCoreFlashes(dt);
                const inactive = !this.activeShow && this.rockets.length === 0 && this.particles.length === 0 && this.trails.length === 0 && this.smokes.length === 0;
                if (inactive && this.resolveShow) { const resolve = this.resolveShow; this.resolveShow = null; resolve(); }
            }

            spawnRocket(preferredX) {
                if (this.rockets.length >= this.maxFireworks) return;
                const launchX = typeof preferredX === 'number' ? preferredX : this.width * (0.25 + Math.random() * 0.5);
                const startY = this.height + 30;
                const targetY = this.height * 0.3 + randRange(0, this.height * 0.1);
                const travel = startY - targetY;
                const vy = -Math.sqrt(2 * 520 * travel);
                const theme = this.randomColorTheme();
                this.rockets.push({ x: launchX, y: startY, vx: (Math.random() - 0.5) * 80, vy, life: 0, targetY, theme, wobbleSeed: Math.random() * Math.PI * 2, exploded: false, trailTick: 0 });
            }

            // 保留颜色主题逻辑但更紧凑
            randomColorTheme() { return choice(this.themeBase); }

            updateRockets(dt) {
                for (let i = this.rockets.length - 1; i >= 0; i--) {
                    const rocket = this.rockets[i]; rocket.life += dt; rocket.vy += 120 * dt; rocket.vx += Math.sin(rocket.life * 6 + rocket.wobbleSeed) * 10 * dt; rocket.x += rocket.vx * dt; rocket.y += rocket.vy * dt; rocket.trailTick += dt;
                    if (rocket.trailTick >= 0.015) { this.trails.push({ x: rocket.x, y: rocket.y, alpha: 1, size: 2.5, decay: 3, color: rgbToString(hexToRgbColor(rocket.theme.colors[1]), 0.9) }); rocket.trailTick = 0; }
                    if ((rocket.y <= rocket.targetY || rocket.vy >= 0) && !rocket.exploded) { this.createExplosion(rocket.x, rocket.y, rocket.theme); this.rockets.splice(i, 1); } else if (rocket.y < -50) this.rockets.splice(i, 1);
                }
            }

            getParticle(config) {
                const pooled = this.particlePool.pop(); const particle = (pooled || new FireworkParticle(this)).init(config); if (this.particles.length < this.maxParticles) this.particles.push(particle);
            }

            /**
             * 生成一层粒子（爆炸层）
             * @param {number} x - 爆炸中心 x
             * @param {number} y - 爆炸中心 y
             * @param {Object} options - 层参数（count,speed,size,gravity,resistance,lifespan,colors,allowReburst）
             */
            spawnParticleLayer(x, y, options) {
                const { count, speed, size, gravity, resistance, lifespan, colors, allowReburst, upwardBias = 0.5 } = options;
                for (let i = 0; i < count; i++) {
                        const bias = Math.pow(Math.random(), 0.3);
                    const speedPerFrame = speed[0] + (speed[1] - speed[0]) * bias;
                    const velocity = speedPerFrame * 60;
                    const theta = randRange(0, Math.PI * 2);
                    const angleVariation = (Math.random() - 0.5) * 0.05;
                    const vx = Math.cos(theta + angleVariation) * velocity;
                    const vy = Math.sin(theta + angleVariation) * velocity;
                    const sizeValue = randRange(size[0], size[1]);
                    const resistanceValue = randRange(resistance[0], resistance[1]);
                    const lifespanValue = randRange(lifespan[0], lifespan[1]);
                    const baseColor = choice(colors);
                    const color = jitterRgb(baseColor, 25);
                    this.getParticle({ x, y, vx, vy, size: sizeValue, lifespan: lifespanValue, gravity, resistance: resistanceValue, color, allowReburst: allowReburst && Math.random() < 0.45, shrink: 0.94 + Math.random() * 0.03, decay: 0.008 + Math.random() * 0.025, alpha: 0.9 + Math.random() * 0.1 });
                }
            }

            createExplosion(x, y, theme) {
                const palette = theme.colors.map(hexToRgbColor);
                this.spawnParticleLayer(x, y, { count: 120, speed: [5, 14], size: [2.5, 5], gravity: 0.15, resistance: [0.96, 0.99], lifespan: [1.5, 2.5], colors: palette, allowReburst: false, upwardBias: 0.0 });
                this.spawnParticleLayer(x, y, { count: 180, speed: [4, 12], size: [2, 4], gravity: 0.16, resistance: [0.97, 0.99], lifespan: [1.8, 2.8], colors: palette, allowReburst: false, upwardBias: 0.0 });
                this.spawnParticleLayer(x, y, { count: 150, speed: [3, 10], size: [1.5, 3], gravity: 0.17, resistance: [0.98, 0.995], lifespan: [2.0, 3.0], colors: palette, allowReburst: false, upwardBias: 0.0 });
                for (let i = 0; i < 30; i++) this.smokes.push({ x: x + (Math.random() - 0.5) * 20, y: y + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 15, vy: -10 - Math.random() * 15, alpha: Math.random() * 0.1, decay: 0.12 + Math.random() * 0.08, size: 15 + Math.random() * 25, color: theme.smoke });
            }

            createSubExplosion(x, y, baseColor) { const palette = [baseColor, hexToRgbColor('#ffffff'), jitterRgb(baseColor, 30)]; this.spawnParticleLayer(x, y, { count: 22 + Math.floor(Math.random() * 18), speed: [2, 4], size: [1.2, 3], gravity: 0.17, resistance: [0.98, 0.995], lifespan: [1.5, 2.5], colors: palette, allowReburst: false, upwardBias: 0.4 }); }

            updateParticles(dt) { for (let i = this.particles.length - 1; i >= 0; i--) { const particle = this.particles[i]; if (!particle.update(dt)) this.particles.splice(i, 1); } }
            updateTrails(dt) { for (let i = this.trails.length - 1; i >= 0; i--) { const trail = this.trails[i]; trail.alpha -= dt * trail.decay; trail.size = Math.max(0, trail.size - dt * 2.5); if (trail.alpha <= 0 || trail.size <= 0) this.trails.splice(i, 1); } }
            updateSmoke(dt) { for (let i = this.smokes.length - 1; i >= 0; i--) { const smoke = this.smokes[i]; smoke.vx *= 0.98; smoke.vy = smoke.vy * 0.98 - 5 * dt; smoke.x += smoke.vx * dt; smoke.y += smoke.vy * dt; smoke.size += dt * 10; smoke.alpha -= smoke.decay * dt; if (smoke.alpha <= 0) this.smokes.splice(i, 1); } }

            updateCoreFlashes(dt) { for (let i = this.coreFlashes.length - 1; i >= 0; i--) { const flash = this.coreFlashes[i]; flash.life += dt; const maxRadius = flash.maxRadius || 60; const expansionSpeed = flash.life < 0.08 ? 150 : 80; flash.radius = Math.min(maxRadius, flash.radius + dt * expansionSpeed); const fadeStart = 2; if (flash.life < fadeStart) flash.alpha = Math.min(flash.alpha, 0.8); else { const fadeDuration = 0.25; const fadeProgress = Math.min(1, (flash.life - fadeStart) / fadeDuration); flash.alpha = flash.alpha * (1 - fadeProgress * fadeProgress * fadeProgress); } if (flash.alpha <= 0.01 || flash.radius >= maxRadius) this.coreFlashes.splice(i, 1); } this.screenFlash *= 0.75; }

            render() {
                const ctx = this.ctx;
                if (!ctx) return;

                ctx.globalCompositeOperation = 'source-over';
                ctx.clearRect(0, 0, this.width, this.height);   // ← 透明底
                this.drawStars(ctx);

                // 使用lighter混合模式让烟花更亮更自然
                ctx.globalCompositeOperation = 'lighter';
                this.drawTrails(ctx);
                this.drawRockets(ctx);
                this.drawParticles(ctx);
                this.drawCoreFlashes(ctx);

                ctx.globalCompositeOperation = 'source-over';
                this.drawSmoke(ctx);
            }

            drawStars(ctx) {
                // 不再绘制烟花 Canvas 自己的星星，背景直接使用 Three.js 星空
                return;
            }

            drawRockets(ctx) {
                this.rockets.forEach(rocket => {
                    const gradient = ctx.createRadialGradient(rocket.x, rocket.y, 0, rocket.x, rocket.y, 10);
                    gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
                    gradient.addColorStop(0.5, rocket.theme.colors[0]);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(rocket.x, rocket.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            drawParticles(ctx) {
                this.particles.forEach(particle => particle.draw(ctx));
            }

            drawTrails(ctx) {
                this.trails.forEach(trail => {
                    // 优化拖尾绘制，增加渐变效果
                    const gradient = ctx.createRadialGradient(
                        trail.x, trail.y, 0,
                        trail.x, trail.y, trail.size
                    );
                    gradient.addColorStop(0, trail.color);
                    gradient.addColorStop(0.5, this.applyAlpha(trail.color, trail.alpha * 0.6));
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');

                    ctx.fillStyle = gradient;
                    ctx.globalAlpha = trail.alpha;
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, trail.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }

            drawSmoke(ctx) {
                this.smokes.forEach(smoke => {
                    const gradient = ctx.createRadialGradient(smoke.x, smoke.y, 0, smoke.x, smoke.y, smoke.size);
                    gradient.addColorStop(0, this.applyAlpha(smoke.color, smoke.alpha));
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(smoke.x, smoke.y, smoke.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            drawCoreFlashes(ctx) {
                // 不绘制核心闪光，爆炸点立即消失，不留晕影
                // 函数保留但为空，避免调用错误
            }

            applyAlpha(color, alpha) {
                if (typeof color === 'string') {
                    const match = color.match(/rgba?\(([^)]+)\)/);
                    if (match) {
                        const parts = match[1].split(',').map(v => v.trim());
                        const [r, g, b] = parts;
                        return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, alpha))})`;
                    }
                    return color;
                }
                const rgb = hexToRgbColor(color);
                return rgbToString(rgb, alpha);
            }
        }

        // ==================== 主场景：数字蛋糕 ====================
        async function transitionToMainScene() {
            console.log('开始过渡到主场景');
            currentPhase = 'main';

            // 主场景：使用倒计时星空作为静态背景（隐藏大粒子背景）
            if (starField) {
                starField.visible = true;
                console.log('transitionToMainScene: starField visible (countdown background used for main)');
            }
            if (goldDust) {
                goldDust.visible = false;
            }
            // 如果还有残留大粒子系统，移出或隐藏
            if (particleSystem) {
                particleSystem.visible = false;
                if (particleSystem.geometry && particleSystem.geometry.attributes.position) {
                    const pa = particleSystem.geometry.attributes.position.array;
                    for (let i = 0; i < pa.length; i++) pa[i] = OFFSCREEN_POS;
                    particleSystem.geometry.attributes.position.needsUpdate = true;
                }
            }

            const camCfg = CONFIG.CAMERA;
            const targetCameraZ = camCfg.TARGET_Z_MAIN;
            const duration = 1000;  // 缩短转场时间，从2500ms减少到1600ms

            if (gsap && typeof gsap.to === 'function') {
                gsap.to(camera.position, {
                    x: 0, y: 0, z: targetCameraZ,
                    duration: duration / 1000,
                    ease: 'sine.out'  // 使用更平滑的sine缓动，让动画更丝滑
                });
                await new Promise(resolve => setTimeout(resolve, duration));
            } else {
                const startPos = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
                const targetPos = { x: 0, y: 0, z: targetCameraZ };
                const startTime = Date.now();

                await new Promise(resolve => {
                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        // 使用sine缓动函数，让动画更平滑丝滑
                        const easeProgress = Math.sin(progress * Math.PI / 2);

                        camera.position.x = startPos.x + (targetPos.x - startPos.x) * easeProgress;
                        camera.position.y = startPos.y + (targetPos.y - startPos.y) * easeProgress;
                        camera.position.z = startPos.z + (targetPos.z - startPos.z) * easeProgress;

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            resolve();
                        }
                    };
                    animate();
                });
            }

            if (particleSystem) {
                scene.remove(particleSystem);
                particleSystem.geometry?.dispose?.();
                particleSystem.material?.dispose?.();
                particleSystem = null;
            }

            // 确保蛋糕场景带上倒计时的星空背景：如果之前已被销毁则重建
            if (!starField) {
                try {
                    createStarField();
                    console.log('transitionToMainScene: recreated starField for cake');
                } catch (e) {
                    console.warn('transitionToMainScene: failed to recreate starField', e);
                }
            } else {
                starField.visible = true;
                console.log('transitionToMainScene: starField ensured visible for cake');
            }

            if (cakePoints) {
                cakePoints.visible = true;
                // 当蛋糕可见时立即开始持续自转：单圈时长为 10 秒（速度 = 2π / 5）
                try {
                    CONFIG.CAKE.ROTATION_SPEED = (Math.PI * 2) / 12; // 单圈 5 秒
                    cakeAutoRotate = true;
                    console.log('蛋糕展示：启用持续自转（单圈 12s）', CONFIG.CAKE.ROTATION_SPEED);
                } catch (e) {
                    console.warn('启用自转失败', e);
                }
            }
            if (floatingTextMesh) {
                floatingTextMesh.visible = true;
            }
            // 仅在主场景显示蜡烛，并播放点燃动画
            if (cakeCandleGroup) {
                cakeCandleGroup.visible = true;
                const flame = cakeCandleGroup.userData?.flame;
                if (flame) {
                    // 使用 GSAP 动画（若可用）否则使用 requestAnimationFrame
                    const animateFlame = (duration = 3000) => {
                        if (gsap && typeof gsap.to === 'function') {
                            return new Promise(resolve => {
                                gsap.to(flame.material, { opacity: 1, duration: duration / 1000, ease: 'power2.out' });
                                gsap.to(flame.scale, { x: 24, y: 48, duration: duration / 1000, ease: 'back.out(1.2)', onComplete: resolve });
                            });
                        }
                        return new Promise(resolve => {
                            const start = performance.now();
                            const dur = duration;
                            const startOpacity = flame.material.opacity ?? 0;
                            const startSX = flame.scale.x;
                            const startSY = flame.scale.y;
                            const targetSX = 24;
                            const targetSY = 48;
                            const tick = (now) => {
                                const t = Math.min(1, (now - start) / dur);
                                const ease = 1 - Math.pow(1 - t, 2);
                                if (flame.material) flame.material.opacity = startOpacity + (1 - startOpacity) * ease;
                                flame.scale.x = startSX + (targetSX - startSX) * ease;
                                flame.scale.y = startSY + (targetSY - startSY) * ease;
                                if (t < 1) requestAnimationFrame(tick);
                                else resolve();
                            };
                            requestAnimationFrame(tick);
                        });
                    };

                    try { await animateFlame(3000); } catch (e) { console.warn('火焰动画失败', e); }
                }
            }

            if (DOM.canvasContainer) {
                // 不再淡出 canvas，以保证星空背景从开始到结束保持不变
                // DOM.canvasContainer.classList.add('fade-out');
            }


            if (DOM.guiPanel) {
                DOM.guiPanel.classList.remove('gui-hidden');
            }


            showStatus('梦幻光粒蛋糕已上线', 3000);

            // 开始：主场景进入后，执行一次 360° Y 轴旋转（优先使用 GSAP，否则使用内置动画）
            async function rotateCake360(duration = 4000) {
                if (!cakeGroup) {
                    console.warn('rotateCake360: cakeGroup 未定义');
                    return;
                }

                // 确保可见并记录初始状态，便于调试
                cakeGroup.visible = true;
                const start = cakeGroup.rotation.y;
                const target = start + Math.PI * 2;
                console.log('rotateCake360: start', { start, target, duration, gsapLoaded: !!(gsap && typeof gsap.to === 'function') });

                if (gsap && typeof gsap.to === 'function') {
                    return new Promise(resolve => {
                        gsap.to(cakeGroup.rotation, {
                            y: target,
                            duration: duration / 1000,
                            ease: 'power2.inOut',
                            onComplete: () => {
                                console.log('rotateCake360: done (gsap)', cakeGroup.rotation.y);
                                resolve();
                            }
                        });
                    });
                }

                return new Promise(resolve => {
                    const t0 = performance.now();
                    let lastLoggedStep = -1;
                    const tick = (now) => {
                        const t = Math.min(1, (now - t0) / duration);
                        const ease = 1 - Math.pow(1 - t, 2);
                        cakeGroup.rotation.y = start + (target - start) * ease;

                        // 每 10% 记录一次进度，避免大量日志
                        const step = Math.floor(t * 10);
                        if (step !== lastLoggedStep) {
                            lastLoggedStep = step;
                            console.log('rotateCake360 progress', Math.round(t * 100) + '%', 'rotationY=', cakeGroup.rotation.y);
                        }

                        if (t < 1) requestAnimationFrame(tick);
                        else {
                            console.log('rotateCake360: done', cakeGroup.rotation.y);
                            resolve();
                        }
                    };
                    requestAnimationFrame(tick);
                });
            }

            // 在控制台暴露一个便捷触发函数，用于调试/手动触发旋转
            window.rotateCakeOnce = (ms = 2000) => rotateCake360(ms).catch(e => console.warn('蛋糕旋转失败:', e));

            // 改为启用持续自转（代替单次旋转），并暴露控制方法
            cakeAutoRotate = true;
            console.log('启用蛋糕持续自转，速度(rad/s)=', CONFIG.CAKE.ROTATION_SPEED);
            window.toggleCakeAutoRotate = (force) => { if (typeof force === 'boolean') cakeAutoRotate = force; else cakeAutoRotate = !cakeAutoRotate; console.log('cakeAutoRotate=', cakeAutoRotate); return cakeAutoRotate; };
            window.setCakeRotationSpeed = (v) => { CONFIG.CAKE.ROTATION_SPEED = Number(v); console.log('cake rotation speed set to', CONFIG.CAKE.ROTATION_SPEED); };
        }

        function createCakeStructure() {
            const cfg = CONFIG.CAKE;
            const layerCount = cfg.LAYER_COUNT;
            const pointsPerLayer = cfg.POINTS_PER_LAYER;
            // 增加底层密度：使用 per-layer multipliers（底层更密）
            const layerMultipliers = [2.4, 1.0, 0.9];
            const layerPointsArr = [];
            let totalPoints = 0;
            for (let li = 0; li < layerCount; li++) {
                const mult = layerMultipliers[li] || 1;
                const cnt = Math.max(8, Math.floor(pointsPerLayer * mult));
                layerPointsArr.push(cnt);
                totalPoints += cnt;
            }

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(totalPoints * 3);
            const colors = new Float32Array(totalPoints * 3);
            const basePositions = new Float32Array(totalPoints * 3);
            const targetPositions = new Float32Array(totalPoints * 3);

            if (cakeGroup) {
                scene.remove(cakeGroup);
            }
            cakeGroup = new THREE.Group();
            // 缩小整体蛋糕到 85%，避免占用页面中心过多空间
            cakeGroup.scale.set(0.85, 0.85, 0.85);
            // 向下移动整组蛋糕以与浮字拉开距离（通过 CONFIG.CAKE.VERTICAL_OFFSET 配置）
            cakeGroup.position.y = cfg.VERTICAL_OFFSET || 0;

            const colorPalette = [
                new THREE.Color(0xffd700),
                new THREE.Color(0xff9a4d),
                new THREE.Color(0xff5f5f),
                new THREE.Color(0xffc2ff),
                new THREE.Color(0xffffff)
            ];

            // 三层蛋糕配置：从底层（最宽）到顶层（最窄），蜡烛放在最上层
            // 1. 可调参数
            const OVERLAP = 20; // 每层之间只重叠 20 单位（想再少改 10 或 5）

            // 2. 原始尺寸
            const radiusArr = [380, 280, 200];
            const thickArr  = [160, 130, 110];

            // 3. 逐层计算
            let layerConfigs = [];
            let bottom = 0; // 最底层从地面 0 开始
            for (let i = 0; i < 3; i++) {
            const thickness = thickArr[i];
            const height = bottom + thickness / 2; // 圆柱中心
            layerConfigs.push({
                radius: radiusArr[i],
                height: height,
                thickness: thickness
            });
            bottom += thickness - OVERLAP; // 下一层底面只往上抬 (thickness - 重叠)
            }

            // 逐层生成，底层使用更多点数
            let idx = 0;
            for (let layer = 0; layer < layerCount; layer++) {
                const layerCfg = layerConfigs[layer] || { radius: 100 + layer * 80, height: -150 + layer * 100, thickness: 60 };
                const radius = layerCfg.radius;
                const height = layerCfg.height;
                const thickness = layerCfg.thickness;

                const pointsThisLayer = layerPointsArr[layer] || pointsPerLayer;
                for (let i = 0; i < pointsThisLayer; i++) {
                    const posIdx = idx * 3;
                    const angle = (Math.PI * 2 * i) / pointsThisLayer + Math.random() * 0.25;
                    const radialOffset = (Math.random() - 0.5) * 35;
                    const heightOffset = (Math.random() - 0.5) * thickness;
                    const currentRadius = radius + radialOffset;

                    const x = Math.cos(angle) * currentRadius;
                    const y = height + heightOffset;
                    const z = Math.sin(angle) * currentRadius;

                    positions[posIdx] = x;
                    positions[posIdx + 1] = y;
                    positions[posIdx + 2] = z;
                    basePositions[posIdx] = x;
                    basePositions[posIdx + 1] = y;
                    basePositions[posIdx + 2] = z;
                    targetPositions[posIdx] = x;
                    targetPositions[posIdx + 1] = y;
                    targetPositions[posIdx + 2] = z;

                    const color = colorPalette[(layer + Math.floor(Math.random() * colorPalette.length)) % colorPalette.length].clone();
                    color.offsetHSL((Math.random() - 0.5) * 0.05, 0.1, 0.1);
                    colors[posIdx] = color.r;
                    colors[posIdx + 1] = color.g;
                    colors[posIdx + 2] = color.b;

                    idx++;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // 生成一个小圆形渐变纹理，让 Points 看起来像小球（有轻微高光）
            const particleCanvas = document.createElement('canvas');
            particleCanvas.width = 64;
            particleCanvas.height = 64;
            const pctx = particleCanvas.getContext('2d');
            const grad = pctx.createRadialGradient(32, 24, 2, 32, 24, 30);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, 'rgba(255,255,255,0.9)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0.6)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            pctx.clearRect(0, 0, 64, 64);
            pctx.fillStyle = grad;
            pctx.beginPath();
            pctx.arc(32, 24, 30, 0, Math.PI * 2);
            pctx.fill();

            const particleTexture = new THREE.CanvasTexture(particleCanvas);
            particleTexture.minFilter = THREE.LinearFilter;
            particleTexture.magFilter = THREE.LinearFilter;

            const material = new THREE.PointsMaterial({
                size: 8,
                map: particleTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });

            cakePoints = new THREE.Points(geometry, material);
            cakePoints.visible = false;
            cakePointCount = totalPoints;
            cakeBasePositions = basePositions;
            cakeTargetPositions = targetPositions;
            cakePositionAttribute = geometry.getAttribute('position');
            cakeGroup.add(cakePoints);

            const topLayerIdx = Math.min(layerCount - 1, layerConfigs.length - 1);
            const topLayerCfg = layerConfigs[topLayerIdx] || { radius: 100, height: -150, thickness: 60 };

            // 在顶层添加蜡烛（圆柱 + 火焰 Sprite）
            try {
                const candleGroup = new THREE.Group();
                // 默认隐藏蜡烛，只有进入主场景时显示
                candleGroup.visible = false;

                const candleRadius = 8;
                const candleHeight = 40;
                const candleGeo = new THREE.CylinderGeometry(candleRadius, candleRadius, candleHeight, 12);
                const candleMat = new THREE.MeshStandardMaterial({ color: 0xfffdf5, metalness: 0.1, roughness: 0.7, emissive: 0x000000, emissiveIntensity: 0 });
                const candle = new THREE.Mesh(candleGeo, candleMat);
                candle.position.set(0, topLayerCfg.height + topLayerCfg.thickness + candleHeight / 2 - 30, 0);
                candleGroup.add(candle);

                // 火焰：使用 Sprite，靠近黄色/橙色渐变
                const flameCanvas = document.createElement('canvas');
                flameCanvas.width = 64;
                flameCanvas.height = 128;
                const fctx = flameCanvas.getContext('2d');
                const flameGrad = fctx.createLinearGradient(32, 8, 32, 120);
                flameGrad.addColorStop(0, 'rgba(255,255,200,1)');
                flameGrad.addColorStop(0.3, 'rgba(255,200,80,0.95)');
                flameGrad.addColorStop(0.6, 'rgba(255,120,40,0.8)');
                flameGrad.addColorStop(1, 'rgba(255,80,20,0)');
                fctx.fillStyle = flameGrad;
                fctx.beginPath();
                fctx.moveTo(32, 4);
                fctx.bezierCurveTo(8, 40, 20, 80, 32, 120);
                fctx.bezierCurveTo(44, 80, 56, 40, 32, 4);
                fctx.closePath();
                fctx.fill();

                const flameTex = new THREE.CanvasTexture(flameCanvas);
                flameTex.minFilter = THREE.LinearFilter;
                const spriteMat = new THREE.SpriteMaterial({ map: flameTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
                const flame = new THREE.Sprite(spriteMat);
                // 初始缩小并透明，等待点燃动画
                flame.scale.set(8, 16, 1);
                if (flame.material) flame.material.opacity = 0;
                flame.position.set(0, candle.position.y + candleHeight / 2 + 18, 0);
                candleGroup.add(flame);

                // 保存对火焰的引用，便于动画控制
                candleGroup.userData.flame = flame;

                cakeGroup.add(candleGroup);
                cakeCandleGroup = candleGroup;
            } catch (e) {
                console.warn('创建蜡烛失败:', e);
            }

            scene.add(cakeGroup);
        }

        function createGoldDust() {

        function createFloatingText() {

                opacity: 1,
                blending: THREE.NormalBlending,
                sizeAttenuation: false,
                depthWrite: false
            });
            // 在渲染顺序上提升，避免被其他发光效果覆盖
            floatingTextMesh = new THREE.Points(textGeometry, floatMat);
            floatingTextMesh.renderOrder = 999;
            floatingTextMesh.position.y = cfg.FLOATING_TEXT_Y;
            floatingTextMesh.visible = false;
            scene.add(floatingTextMesh);
        }

        // ==================== 动画循环 ====================
        let animationRunning = false;
        let _lastFrameTime = performance.now();
        function animate() {
            const _now = performance.now();
            const _dt = Math.min(0.1, (_now - _lastFrameTime) / 1000);
            _lastFrameTime = _now;

            if (!animationRunning) {
                animationRunning = true;
                console.log('动画循环已启动');
            }
            requestAnimationFrame(animate);

            if (currentPhase === 'intro' && particleSystem?.geometry && targets) {
                const positionArray = particleSystem.geometry.attributes.position.array;
                const cfg = CONFIG.ANIMATION;
                const dt = Math.min(cfg.DT_MAX, cfg.DT_MIN);

                for (let i = 0; i < particleCount; i++) {
                    const idx = i * 3;
                    const targetX = targets[idx] || 0;
                    const targetY = targets[idx + 1] || 0;
                    const targetZ = targets[idx + 2] || 0;
                    const currentX = positionArray[idx] || 0;
                    const currentY = positionArray[idx + 1] || 0;
                    const currentZ = positionArray[idx + 2] || 0;

                    const dx = targetX - currentX;
                    const dy = targetY - currentY;
                    const dz = targetZ - currentZ;
                    const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (distance < cfg.DISTANCE_THRESHOLD) {
                        positionArray[idx] = targetX;
                        positionArray[idx + 1] = targetY;
                        positionArray[idx + 2] = targetZ;
                        velocities[idx] = velocities[idx + 1] = velocities[idx + 2] = 0;
                        continue;
                    }

                    const speedFactor = Math.min(1, distance / 150) * cfg.SPEED_FACTOR_MULT + cfg.SPEED_FACTOR_BASE;
                    const vx = (velocities[idx] || 0) + dx * speedFactor * dt;
                    const vy = (velocities[idx + 1] || 0) + dy * speedFactor * dt;
                    const vz = (velocities[idx + 2] || 0) + dz * speedFactor * dt;

                    const damping = distance > 200 ? cfg.DAMPING_FAR : (distance > 50 ? cfg.DAMPING_MID : cfg.DAMPING_NEAR);
                    velocities[idx] = vx * damping;
                    velocities[idx + 1] = vy * damping;
                    velocities[idx + 2] = vz * damping;

                    positionArray[idx] = currentX + velocities[idx];
                    positionArray[idx + 1] = currentY + velocities[idx + 1];
                    positionArray[idx + 2] = currentZ + velocities[idx + 2];
                }

                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            if (currentPhase === 'main' && cakePoints && cakePositionAttribute && cakeTargetPositions) {
                const positionsArray = cakePositionAttribute.array;
                const cfg = CONFIG.ANIMATION;
                for (let i = 0; i < cakePointCount; i++) {
                    const idx = i * 3;
                    positionsArray[idx] += (cakeTargetPositions[idx] - positionsArray[idx]) * cfg.CAKE_LERP;
                    positionsArray[idx + 1] += (cakeTargetPositions[idx + 1] - positionsArray[idx + 1]) * cfg.CAKE_LERP;
                    positionsArray[idx + 2] += (cakeTargetPositions[idx + 2] - positionsArray[idx + 2]) * cfg.CAKE_LERP;
                }
                cakePositionAttribute.needsUpdate = true;


                scene.rotation.x = sceneRotation.x;
                scene.rotation.y = sceneRotation.y;

                // 如果启用了自动旋转，则让 cakeGroup 绕 Y 轴持续旋转（单位：弧度/秒）
                if (cakeAutoRotate && cakeGroup) {
                    cakeGroup.rotation.y += CONFIG.CAKE.ROTATION_SPEED * _dt;
                }
                // 火苗始终看向镜头
                if (cakeCandleGroup?.userData?.flame) {
                    cakeCandleGroup.userData.flame.lookAt(camera.position);

                    // 火焰跳动
                    const f = cakeCandleGroup.userData.flame;
                    const t = _now * 0.01;
                    const bounce = 0.8 + Math.sin(t * 7) * 0.15 + Math.sin(t * 13) * 0.05;
                    f.scale.set(24 * bounce, 48 * bounce, 1);
                    f.material.opacity = 0.9 + Math.sin(t * 9) * 0.1;
                }
            }

            // 渲染场景
            if (composer && scene && camera) {
                try {
                    composer.render();
                } catch (e) {
                    // 如果 composer 渲染失败，使用基础渲染
                    if (renderer && scene && camera) {
                        renderer.render(scene, camera);
                    }
                }
            } else if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            if (renderer) {
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            if (composer) {
                composer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // ==================== 初始化 ====================
        async function init() {
            try {
                console.log('开始初始化...');
                initDOMCache();

                if (!THREE) {
                    console.error('Three.js 未加载');
                    return;
                }

                animate();
                initScene();

                await new Promise(resolve => setTimeout(resolve, 300));

                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                    console.log('初始场景渲染完成');
                    console.log('场景子对象数量:', scene.children.length);
                    console.log('场景子对象:', scene.children.map(c => c.type));
                }

                console.log('粒子系统状态:', {
                    exists: !!particleSystem,
                    geometry: !!particleSystem?.geometry,
                    material: !!particleSystem?.material,
                    inScene: scene.children.includes(particleSystem),
                    particleCount: particleSystem?.geometry?.attributes?.position?.count / 3
                });

                for (let i = 0; i < 5; i++) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                    if (renderer && scene && camera) {
                        (composer || renderer).render(scene, camera);
                    }
                }
                console.log('强制渲染完成');

                if (DOM.startScreen) {
                    DOM.startScreen.classList.remove('hidden');
                }

                console.log('等待用户点击开始按钮...');
            } catch (error) {
                console.error('初始化错误:', error);
                console.error('错误堆栈:', error.stack);
                showStatus('初始化失败: ' + (error.message || '未知错误') + '，请查看控制台（F12）', 10000);
            }
        }

        // 启动应用
        async function startApp() {
            console.log('准备启动应用...');
            // 等待 DOM 加载完成
            if (document.readyState === 'loading') {
                await new Promise(resolve => {
                    window.addEventListener('DOMContentLoaded', resolve);
                });
            }

            // 等待可选模块加载完成（最多等待2秒）
            try {
                await Promise.race([
                    modulesLoadingPromise,
                    new Promise(resolve => setTimeout(resolve, 2000)) // 最多等待2秒
                ]);
            } catch (e) {
                console.warn('模块加载等待出错:', e);
            }

            console.log('开始初始化应用');
            console.log('THREE:', typeof THREE);
            console.log('EffectComposer:', typeof EffectComposer);
            console.log('GSAP:', gsap ? '已加载' : '未加载');

            await init();

            // 设置开始按钮事件
            setupStartButton();
        }

        // 设置开始按钮事件
        function setupStartButton() {
            if (DOM.startBtn) {
                DOM.startBtn.addEventListener('click', async () => {
                    console.log('用户点击开始按钮');
                    if (DOM.startScreen) {
                        DOM.startScreen.classList.add('hidden');
                    }

                    await startIntroSequence();
                });
            }

        }

        // 立即启动（模块导入完成后）
        startApp().catch(error => {
            console.error('应用启动失败:', error);
            // 启动失败
            showStatus('应用启动失败，请刷新页面', 10000);
        });
    </script>
</body>
